<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon QR Code — MIJO PAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0y1rv0svTjwGkxtcBfteXPTbXm49EaAaK+F21A0hK77v8F1AWJz1Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    --navy-950:#0a1120; --navy-900:#0f1830; --navy-800:#16213f;
    --line:#28345a; --orange:#ff6b35; --gold:#ffc266;
    --text-hi:#f4f6fb; --text-mid:#aab4cc; --text-low:#6b769a;
    --error:#ff5c72; --ok:#38d996; --warn:#ffb648;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #ff6b3518, transparent),
      radial-gradient(ellipse 600px 400px at 90% 100%, #ffc26612, transparent),
      var(--navy-950);
    color:var(--text-hi); font-family:'Inter',sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
  }

  .wrap{max-width:420px; width:100%;}

  /* ---------- Hero de marque : le "poster" MIJO PAY ---------- */
  .hero-brand{text-align:center; margin-bottom:22px;}
  .hero-logo{width:76px; height:76px; object-fit:contain; margin-bottom:10px;
    filter:drop-shadow(0 6px 18px #ff6b3540);}
  .hero-tagline{
    font-family:'Syne',sans-serif; font-weight:800; font-size:22px; letter-spacing:-0.01em;
    color:var(--text-hi);
  }
  .hero-tagline span{
    background:linear-gradient(120deg, var(--gold), var(--orange));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .card{
    background:linear-gradient(165deg, var(--navy-900), var(--navy-800));
    border:1px solid var(--line); border-radius:22px;
    padding:32px 28px; text-align:center; position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:-40%; left:50%; transform:translateX(-50%);
    width:140%; height:160px; background:radial-gradient(ellipse, #ff6b3520, transparent 70%);
    pointer-events:none;
  }

  h1{font-family:'Syne',sans-serif; font-weight:800; font-size:18px; margin-bottom:4px; position:relative;}
  .business-name{color:var(--text-mid); font-size:13.5px; margin-bottom:24px; position:relative;}

  /* ---------- Cadre QR avec coins "viseur" ---------- */
  .qr-frame{
    background:#ffffff; border-radius:18px; padding:22px;
    display:inline-flex; align-items:center; justify-content:center;
    margin-bottom:20px; position:relative;
    box-shadow:0 0 0 1px var(--line), 0 20px 40px -20px #000a;
  }
  #qrcode{line-height:0;}
  #qrcode img, #qrcode canvas{border-radius:6px; display:block;}

  .corner{position:absolute; width:22px; height:22px; border:3px solid var(--orange);}
  .corner.tl{top:6px; left:6px; border-right:none; border-bottom:none; border-radius:6px 0 0 0;}
  .corner.tr{top:6px; right:6px; border-left:none; border-bottom:none; border-radius:0 6px 0 0;}
  .corner.bl{bottom:6px; left:6px; border-right:none; border-top:none; border-radius:0 0 0 6px;}
  .corner.br{bottom:6px; right:6px; border-left:none; border-top:none; border-radius:0 0 6px 0;}

  .logo-overlay{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:44px; height:44px; border-radius:10px; background:#fff;
    border:3px solid #fff; box-shadow:0 0 0 1px var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .logo-overlay img{width:100%; height:100%; object-fit:cover;}

  .business-id{
    font-family:monospace; font-size:11.5px; color:var(--text-low);
    background:var(--navy-800); border:1px solid var(--line); border-radius:8px;
    padding:7px 12px; margin-bottom:24px; display:inline-block; position:relative;
  }

  .btn-row{display:flex; gap:10px; position:relative;}
  .btn{
    flex:1; padding:13px; border-radius:11px; border:none; font-family:'Syne',sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer; transition:filter .15s, transform .15s;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .btn:focus-visible{outline:2px solid var(--orange); outline-offset:2px;}
  .btn-primary{background:linear-gradient(135deg, var(--gold), var(--orange)); color:var(--navy-950);}
  .btn-secondary{background:var(--navy-800); color:var(--text-hi); border:1px solid var(--line);}

  .hint{font-size:12px; color:var(--text-low); margin-top:18px; line-height:1.6; position:relative;}
  .err-detail{font-size:10.5px; color:var(--text-low); margin-top:10px; word-break:break-all;}

  .state-msg{text-align:center; padding:40px 20px; color:var(--text-mid);}
  .state-msg .icon{font-size:26px; margin-bottom:10px;}
  .state-msg .action-link{
    display:inline-block; margin-top:16px; padding:11px 20px; background:var(--orange);
    color:var(--navy-950); border-radius:10px; text-decoration:none; font-weight:700; font-size:13px;
    font-family:'Syne',sans-serif;
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    padding:5px 12px; border-radius:100px; margin-bottom:20px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .status-pill.en_attente{background:#ffb64818; color:var(--warn); border:1px solid #ffb64840;}
  .status-pill.rejete{background:#ff5c7218; color:var(--error); border:1px solid #ff5c7240;}

  /* ---------- Impression : garde le "poster" de marque, cache les contrôles ---------- */
  @media print{
    body{background:#fff !important; padding:0; display:block;}
    .wrap{max-width:none;}
    .hero-tagline{color:#0a1120;}
    .hero-tagline span{-webkit-text-fill-color:var(--orange); color:var(--orange);}
    .card{border:none; box-shadow:none; background:#fff; padding:20px;}
    .card::before{display:none;}
    h1, .business-name{color:#0a1120;}
    .business-id{background:#f2f2f2; color:#333; border-color:#ddd;}
    .btn-row, .hint{display:none !important;}
    .qr-frame{box-shadow:none; border:2px solid #0a1120;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero-brand">
    <img class="hero-logo" src="https://i.postimg.cc/yYCsdY18/remove.png" alt="MIJO PAY">
    <div class="hero-tagline">Payez via <span>MIJO PAY</span></div>
  </div>

  <div class="card" id="card">
    <div class="state-msg" id="loadingMsg"><div class="icon">⏳</div>Chargement…</div>
  </div>

</div>

<script>
  // ────────────────────────────────────────────────────────────
  // CONFIGURATION — à ajuster selon vos noms réels
  // ────────────────────────────────────────────────────────────
  const CONFIG = {
    API_URL: "https://entreprises.mijocomplexe.workers.dev/", // même Worker business-request, route GET /me
    // Page où le client atterrit en scannant, saisit son montant et paie.
    // Ajustez si le vrai nom de cette page diffère — le "*" ci-dessous est un
    // repère à remplacer, il ne doit pas rester dans l'URL finale.
    PAY_PAGE_URL: "https://mijopay.com/pay",
    MIJOPAY_LOGO: "https://i.postimg.cc/yYCsdY18/remove.png"
  };

  const card = document.getElementById("card");

  function getToken() { return localStorage.getItem("token") || ""; }
  function getUser() {
    try { return JSON.parse(localStorage.getItem("user") || "null"); }
    catch (e) { return null; }
  }

  function renderLoginGate() {
    card.innerHTML = `
      <div class="state-msg">
        <div class="icon">🔒</div>
        Connectez-vous à votre compte Business pour voir votre QR code.
        <a class="action-link" href="index.html">Se connecter</a>
      </div>`;
  }

  function renderNoBusiness() {
    card.innerHTML = `
      <div class="state-msg">
        <div class="icon">🏪</div>
        Aucun compte Business associé à ce profil.
        <a class="action-link" href="business-request-form.html">Créer un compte Business</a>
      </div>`;
  }

  function renderPending() {
    card.innerHTML = `
      <div class="state-msg">
        <div class="icon">⏳</div>
        <span class="status-pill en_attente" style="display:inline-flex;">En attente d'approbation</span>
        <div>Votre demande est en cours d'examen. Le QR code sera disponible dès l'approbation (48 à 72h).</div>
      </div>`;
  }

  function renderRejected() {
    card.innerHTML = `
      <div class="state-msg">
        <div class="icon">✕</div>
        <span class="status-pill rejete" style="display:inline-flex;">Demande rejetée</span>
        <div>Votre demande de compte Business n'a pas été approuvée. Contactez le support pour plus de détails.</div>
      </div>`;
  }

  // err est optionnel : quand fourni, on affiche un détail technique discret
  // pour pouvoir diagnostiquer (CORS, DNS, JSON invalide...) sans devoir
  // rouvrir les devtools à chaque fois.
  function renderServerError(err) {
    card.innerHTML = `
      <div class="state-msg">
        <div class="icon">⚠️</div>
        Connexion au serveur impossible.
        ${err ? `<div class="err-detail">${escapeHtml(err.message || String(err))}</div>` : ""}
      </div>`;
  }

  function renderQR(entreprise) {
    const payUrl = `${CONFIG.PAY_PAGE_URL}?businessId=${encodeURIComponent(entreprise.businessId)}`;

    card.innerHTML = `
      <h1>${escapeHtml(entreprise.NomCommercial)}</h1>
      <div class="business-name">Scannez pour payer en toute sécurité</div>

      <div class="qr-frame">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <div id="qrcode"></div>
        ${entreprise.LogoURL ? `<div class="logo-overlay"><img src="${entreprise.LogoURL}" alt=""></div>` : ""}
      </div>

      <div class="business-id">${escapeHtml(entreprise.businessId)}</div>

      <div class="btn-row">
        <button class="btn btn-primary" id="downloadBtn">⬇ Télécharger</button>
        <button class="btn btn-secondary" id="printBtn">🖨 Imprimer</button>
      </div>

      <p class="hint">Affichez ce QR code dans votre commerce. Vos clients le scannent, saisissent leur montant, et paient directement sur votre compte MIJO PAY.</p>
    `;

    new QRCode(document.getElementById("qrcode"), {
      text: payUrl,
      width: 220,
      height: 220,
      colorDark: "#0a1120",
      colorLight: "#ffffff",
      correctLevel: entreprise.LogoURL ? QRCode.CorrectLevel.H : QRCode.CorrectLevel.M
      // Niveau H (haute correction d'erreur) quand un logo recouvre le centre,
      // pour que le QR reste scannable malgré l'overlay.
    });

    document.getElementById("downloadBtn").addEventListener("click", () => downloadQR(entreprise));
    document.getElementById("printBtn").addEventListener("click", () => window.print());
  }

  // Compose une petite affiche marketing (logo MIJO PAY + accroche + QR +
  // nom du commerce) dans un canvas hors-écran, puis la télécharge en PNG.
  // Si l'image du logo est hébergée sans en-têtes CORS ouverts, le canvas
  // est "taché" et l'export échoue silencieusement — on retombe alors sur
  // le téléchargement simple du QR seul, sans casser le bouton.
  async function downloadQR(entreprise) {
    const qrCanvas = document.querySelector("#qrcode canvas");
    const qrImg = document.querySelector("#qrcode img");
    const qrSource = qrCanvas || qrImg;
    if (!qrSource) return;

    try {
      const poster = document.createElement("canvas");
      poster.width = 600;
      poster.height = 780;
      const ctx = poster.getContext("2d");

      // fond
      ctx.fillStyle = "#0a1120";
      ctx.fillRect(0, 0, poster.width, poster.height);
      const glow = ctx.createRadialGradient(300, 40, 10, 300, 40, 320);
      glow.addColorStop(0, "#ff6b3530");
      glow.addColorStop(1, "#0a112000");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, poster.width, 400);

      const logoImg = await loadImage(CONFIG.MIJOPAY_LOGO);
      const logoSize = 110;
      ctx.drawImage(logoImg, poster.width / 2 - logoSize / 2, 46, logoSize, logoSize);

      ctx.textAlign = "center";
      ctx.fillStyle = "#f4f6fb";
      ctx.font = "800 34px Syne, sans-serif";
      ctx.fillText("Payez via", poster.width / 2, 205);
      ctx.fillStyle = "#ff6b35";
      ctx.font = "800 34px Syne, sans-serif";
      ctx.fillText("MIJO PAY", poster.width / 2, 246);

      // cadre blanc du QR
      const frameSize = 320, frameX = poster.width / 2 - frameSize / 2, frameY = 288;
      ctx.fillStyle = "#ffffff";
      roundRect(ctx, frameX, frameY, frameSize, frameSize, 20);
      ctx.fill();
      const qrSize = 260;
      ctx.drawImage(qrSource, frameX + (frameSize - qrSize) / 2, frameY + (frameSize - qrSize) / 2, qrSize, qrSize);

      if (entreprise.LogoURL) {
        try {
          const bizLogo = await loadImage(entreprise.LogoURL);
          const badge = 56, bx = poster.width / 2 - badge / 2, by = frameY + (frameSize - badge) / 2;
          ctx.fillStyle = "#ffffff";
          roundRect(ctx, bx - 4, by - 4, badge + 8, badge + 8, 12);
          ctx.fill();
          ctx.save();
          roundRect(ctx, bx, by, badge, badge, 8);
          ctx.clip();
          ctx.drawImage(bizLogo, bx, by, badge, badge);
          ctx.restore();
        } catch (e) { /* logo du commerce indisponible en export — on garde le QR seul */ }
      }

      ctx.fillStyle = "#f4f6fb";
      ctx.font = "700 24px Syne, sans-serif";
      ctx.fillText(entreprise.NomCommercial, poster.width / 2, frameY + frameSize + 56);

      ctx.fillStyle = "#6b769a";
      ctx.font = "400 15px Inter, sans-serif";
      ctx.fillText("Scannez pour payer en toute sécurité", poster.width / 2, frameY + frameSize + 84);

      const link = document.createElement("a");
      link.download = `mijopay-qr-${entreprise.businessId}.png`;
      link.href = poster.toDataURL("image/png");
      link.click();

    } catch (e) {
      // canvas "taché" (CORS) ou autre échec de composition : on retombe sur
      // le téléchargement simple du QR seul plutôt que de bloquer l'action.
      const link = document.createElement("a");
      link.download = `qrcode-${entreprise.businessId}.png`;
      link.href = qrCanvas ? qrCanvas.toDataURL("image/png") : qrImg.src;
      link.click();
    }
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function init() {
    const token = getToken();
    const user = getUser();

    if (!user || !user.userId || !token) {
      renderLoginGate();
      return;
    }

    try {
      const res = await fetch(CONFIG.API_URL, {
        method: "GET",
        headers: { "Authorization": `Bearer ${token}` }
      });

      let data;
      try {
        data = await res.json();
      } catch (parseErr) {
        // la réponse n'est pas du JSON valide (page d'erreur HTML, blocage
        // en amont du Worker, etc.) — on le signale explicitement plutôt
        // que de laisser planter silencieusement.
        renderServerError(new Error(`Réponse invalide du serveur (statut ${res.status}).`));
        return;
      }

      if (!res.ok || !data.success) {
        if (res.status === 401) {
          localStorage.removeItem("token");
          localStorage.removeItem("user");
          renderLoginGate();
          return;
        }
        if (res.status === 404) {
          renderNoBusiness();
        } else {
          card.innerHTML = `<div class="state-msg"><div class="icon">⚠️</div>${escapeHtml(data.error || "Erreur de chargement.")}</div>`;
        }
        return;
      }

      const entreprise = data.entreprise;
      if (entreprise.Statut === "approuve") {
        renderQR(entreprise);
      } else if (entreprise.Statut === "en_attente") {
        renderPending();
      } else if (entreprise.Statut === "rejete") {
        renderRejected();
      } else {
        renderNoBusiness();
      }

    } catch (err) {
      // fetch a rejeté avant même d'obtenir une réponse : le plus souvent
      // CORS, DNS, ou le Worker injoignable. Le détail ci-dessous aide à
      // distinguer les trois cas sans rouvrir les devtools.
      renderServerError(err);
    }
  }

  init();
</script>
</body>
</html>
