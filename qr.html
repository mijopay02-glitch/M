<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon QR Code — MIJO PAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2f8fd6; --teal:#38c2c9; --orange:#ff7a3d; --gold:#ffb648;
    --ink:#141a2b; --ink-soft:#59627a; --line:#e3e7f0; --paper:#ffffff;
    --page-1:#e9eef7; --page-2:#dde6f2;
    --error:#d93f56; --ok:#1f9d6e; --warn:#c97a10;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 800px 460px at 50% -8%, #2f8fd614, transparent),
      radial-gradient(ellipse 600px 420px at 100% 100%, #ff7a3d10, transparent),
      linear-gradient(180deg, var(--page-1), var(--page-2));
    color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:40px 16px;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
  }

  .wrap{max-width:380px; width:100%;}

  /* ---------- Le panneau : titre de marque + logo + QR, façon
     affichette "scannez pour payer" ---------- */
  .card{
    background:var(--paper); border-radius:22px;
    box-shadow:0 30px 60px -24px #1a233530, 0 2px 0 #ffffff inset;
    text-align:center; position:relative;
  }

  .card-body{padding:32px 26px 26px;}

  .headline{
    font-family:'Syne',sans-serif; font-weight:800; font-size:19px; letter-spacing:0.01em;
    text-transform:uppercase; color:var(--ink); margin-bottom:2px;
  }
  .headline .brand-name{
    background:linear-gradient(120deg, var(--orange), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .merchant-name{
    font-family:'Syne',sans-serif; font-weight:700; font-size:20px; color:var(--ink);
    margin:16px 0 22px; line-height:1.3; word-break:break-word;
  }

  /* ---------- Cadre QR avec coins "viseur" bleus ---------- */
  .qr-frame{
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px;
    display:inline-flex; align-items:center; justify-content:center;
    margin-bottom:14px; position:relative;
    box-shadow:0 14px 30px -18px #1a233540;
  }
  #qrcode{line-height:0;}
  #qrcode img, #qrcode canvas{border-radius:4px; display:block;}

  .corner{position:absolute; width:22px; height:22px; border:3px solid transparent;}
  .corner.tl{top:6px; left:6px; border-right:none; border-bottom:none; border-radius:6px 0 0 0; border-color:var(--blue);}
  .corner.tr{top:6px; right:6px; border-left:none; border-bottom:none; border-radius:0 6px 0 0; border-color:var(--teal);}
  .corner.bl{bottom:6px; left:6px; border-right:none; border-top:none; border-radius:0 0 0 6px; border-color:var(--orange);}
  .corner.br{bottom:6px; right:6px; border-left:none; border-top:none; border-radius:0 0 6px 0; border-color:var(--gold);}

  .logo-overlay{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:46px; height:46px; border-radius:10px; background:#fff;
    border:3px solid #fff; box-shadow:0 0 0 1px var(--line), 0 2px 8px -2px #1a233540;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .logo-overlay img{width:100%; height:100%; object-fit:cover;}

  .scan-tag{
    display:inline-flex; align-items:center; gap:6px; background:var(--page-1);
    color:var(--ink); font-size:12px; font-weight:700; padding:7px 15px;
    border-radius:100px; margin-bottom:16px;
  }

  .business-id{
    font-family:monospace; font-size:11px; color:var(--ink-soft);
    background:var(--page-1); border:1px solid var(--line); border-radius:8px;
    padding:6px 11px; margin-bottom:18px; display:inline-block;
  }

  /* ---------- Contrôles (hors du panneau imprimable) ---------- */
  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; padding:13px; border-radius:11px; border:none; font-family:'Syne',sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer; transition:filter .15s, transform .15s;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn:hover{filter:brightness(1.06); transform:translateY(-1px);}
  .btn:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  .btn-primary{background:linear-gradient(120deg, var(--orange), var(--gold)); color:#241205;}
  .btn-secondary{background:#fff; color:var(--ink); border:1px solid var(--line);}

  .hint{font-size:12px; color:var(--ink-soft); margin-top:16px; line-height:1.6; text-align:center;}
  .err-detail{font-size:10.5px; color:var(--ink-soft); margin-top:10px; word-break:break-all;}

  .state-msg{text-align:center; padding:40px 26px; color:var(--ink-soft);}
  .state-msg .icon{font-size:26px; margin-bottom:10px;}
  .state-msg .action-link{
    display:inline-block; margin-top:16px; padding:11px 20px; background:var(--blue);
    color:#fff; border-radius:10px; text-decoration:none; font-weight:700; font-size:13px;
    font-family:'Syne',sans-serif;
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    padding:5px 12px; border-radius:100px; margin-bottom:20px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .status-pill.en_attente{background:#c97a1014; color:var(--warn); border:1px solid #c97a1030;}
  .status-pill.rejete{background:#d93f5614; color:var(--error); border:1px solid #d93f5630;}

  /* ---------- Impression : uniquement le panneau, tel un vrai support ---------- */
  @media print{
    body{background:#fff !important; padding:0; display:block;}
    .wrap{max-width:none;}
    .card{box-shadow:none; border-radius:0;}
    .btn-row, .hint{display:none !important;}
    .qr-frame{box-shadow:none; border:1px solid #ccc;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="card" id="card">
    <div class="card-body">
      <div class="state-msg" id="loadingMsg"><div class="icon">⏳</div>Chargement…</div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   QR Code Generator for JavaScript — vendored inline on purpose.
   Author: Kazuhiko Arase — MIT license — http://www.d-project.com/
   https://github.com/kazuhikoarase/qrcode-generator
   Embedded directly (instead of loaded from a CDN) so this page never
   again fails with "QRCode is not defined": that error meant the
   external <script> tag never loaded — most likely blocked by a CSP
   script-src that doesn't allowlist the CDN domain, or the CDN being
   briefly unreachable. Vendoring removes that failure mode entirely.
   ============================================================ */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);

  // Encode text with the vendored qrcode-generator library and paint the
  // module matrix onto a canvas placed inside `container`. typeNumber 0
  // lets the library auto-pick the smallest version that fits the data.
  function drawQRCode(container, text, size, correctLevel) {
    const qr = qrcode(0, correctLevel || "M");
    qr.addData(text);
    qr.make();

    const count = qr.getModuleCount();
    const cell = size / count;

    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#0a1120";
    for (let row = 0; row < count; row++) {
      for (let col = 0; col < count; col++) {
        if (qr.isDark(row, col)) {
          // +/- a fraction of a pixel avoids faint white seams between
          // adjacent modules from sub-pixel rounding.
          ctx.fillRect(Math.floor(col * cell), Math.floor(row * cell), Math.ceil(cell) + 1, Math.ceil(cell) + 1);
        }
      }
    }
    container.innerHTML = "";
    container.appendChild(canvas);
    return canvas;
  }

  function renderQR(entreprise) {
    const payUrl = `${CONFIG.PAY_PAGE_URL}?businessId=${encodeURIComponent(entreprise.businessId)}`;

    card.innerHTML = `

    // Niveau H (haute correction d'erreur) car le logo MIJO PAY recouvre

    drawQRCode(document.getElementById("qrcode"), payUrl, 200, "H");

  // Compose la même affiche que celle affichée à l'écran (titre, nom du
  // commerce, QR avec le logo MIJO PAY au centre, coins colorés) dans un
  // canvas hors-écran, puis la télécharge en PDF — prête à imprimer et
  // afficher au comptoir.
  async function downloadQR(entreprise) {
    const qrCanvas = document.querySelector("#qrcode canvas");
    const qrImg = document.querySelector("#qrcode img");
    const qrSource = qrCanvas || qrImg;
    if (!qrSource) return;

    try {
      const W = 640, H = 860;
      const poster = document.createElement("canvas");
      poster.width = W;
      poster.height = H;
      const ctx = poster.getContext("2d");

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";

      // titre bicolore : "Payer via" (encre) + "MIJO PAY" (dégradé orange)
      ctx.fillStyle = "#141a2b";
      ctx.font = "800 32px Syne, sans-serif";
      const partA = "PAYER VIA ";
      const partB = "MIJO PAY";
      const widthA = ctx.measureText(partA).width;
      const widthB = ctx.measureText(partB).width;
      const startX = W / 2 - (widthA + widthB) / 2;
      ctx.textAlign = "left";
      ctx.fillText(partA, startX, 76);
      const grad = ctx.createLinearGradient(startX + widthA, 0, startX + widthA + widthB, 0);
      grad.addColorStop(0, "#ff7a3d");
      grad.addColorStop(1, "#ffb648");
      ctx.fillStyle = grad;
      ctx.fillText(partB, startX + widthA, 76);
      ctx.textAlign = "center";

      // nom du commerce, à la place où figurait le logo auparavant
      ctx.fillStyle = "#141a2b";
      ctx.font = "700 26px Syne, sans-serif";
      fitText(ctx, entreprise.NomCommercial, W / 2, 140, W - 120, 26);

      // cadre blanc du QR avec coins "viseur" multicolores
      const frameSize = 360, frameX = W / 2 - frameSize / 2, frameY = 190;
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#e3e7f0";
      ctx.lineWidth = 2;
      roundRect(ctx, frameX, frameY, frameSize, frameSize, 18);
      ctx.fill();
      ctx.stroke();
      const qrSize = 300;
      ctx.drawImage(qrSource, frameX + (frameSize - qrSize) / 2, frameY + (frameSize - qrSize) / 2, qrSize, qrSize);
      drawViewfinderCorners(ctx, frameX, frameY, frameSize, 30, 4,
        ["#2f8fd6", "#38c2c9", "#ff7a3d", "#ffb648"]); // TL bleu, TR sarcelle, BL orange, BR or

      // logo MIJO PAY au centre du QR (toujours présent, comme à l'écran)
      try {
        const mijoLogo = await loadImage(CONFIG.MIJOPAY_LOGO);
        const badge = 64, bx = W / 2 - badge / 2, by = frameY + (frameSize - badge) / 2;
        ctx.fillStyle = "#ffffff";
        roundRect(ctx, bx - 5, by - 5, badge + 10, badge + 10, 13);
        ctx.fill();
        ctx.save();
        roundRect(ctx, bx, by, badge, badge, 9);
        ctx.clip();
        ctx.drawImage(mijoLogo, bx, by, badge, badge);
        ctx.restore();
      } catch (e) { /* logo indisponible en export — on garde le QR seul */ }

      // pastille "Scanner pour payer"
      const tagY = frameY + frameSize + 34, tagText = "\u{1F449} Scanner pour payer";
      ctx.font = "700 16px Inter, sans-serif";
      const tagW = ctx.measureText(tagText).width + 40;
      ctx.fillStyle = "#e9eef7";
      roundRect(ctx, W / 2 - tagW / 2, tagY - 24, tagW, 42, 21);
      ctx.fill();
      ctx.fillStyle = "#141a2b";
      ctx.fillText(tagText, W / 2, tagY + 4);

      ctx.font = "500 13px Inter, sans-serif";
      ctx.fillStyle = "#59627a";
      ctx.fillText(entreprise.businessId, W / 2, tagY + 44);

      downloadCanvasAsPdf(poster, `mijopay-qr-${entreprise.businessId}.pdf`);

    } catch (e) {
      // échec de composition (image manquante, etc.) : on retombe sur
      // un PDF ne contenant que le QR seul plutôt que de bloquer l'action.
      const size = qrCanvas ? qrCanvas.width : 240;
      const fallback = document.createElement("canvas");
      fallback.width = size;
      fallback.height = size;
      const fctx = fallback.getContext("2d");
      fctx.fillStyle = "#ffffff";
      fctx.fillRect(0, 0, size, size);
      fctx.drawImage(qrSource, 0, 0, size, size);
      downloadCanvasAsPdf(fallback, `qrcode-${entreprise.businessId}.pdf`);
    }
  }

  // Dessine un texte centré sur une largeur max, en réduisant la taille de
  // police par paliers si le nom du commerce est trop long pour tenir sur
  // une seule ligne.
  function fitText(ctx, text, cx, y, maxWidth, baseSize) {
    let size = baseSize;
    ctx.font = `700 ${size}px Syne, sans-serif`;
    while (ctx.measureText(text).width > maxWidth && size > 14) {
      size -= 2;
      ctx.font = `700 ${size}px Syne, sans-serif`;
    }
    ctx.fillText(text, cx, y);
  }

  // Convertit un canvas en PDF d'une page (image plein cadre) et déclenche
  // le téléchargement. Construit le PDF nous-mêmes, octet par octet, plutôt
  // que d'ajouter une bibliothèque externe (~400 Ko) ou une dépendance CDN —
  // exactement le genre de dépendance externe qui a cassé le QR la dernière
  // fois. Validé séparément par relecture avec deux analyseurs PDF indépendants.
  function downloadCanvasAsPdf(canvas, filename) {
    const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
    const base64 = dataUrl.split(",")[1];
    const binary = atob(base64);
    const jpegBytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) jpegBytes[i] = binary.charCodeAt(i);

    const pdfBytes = buildSingleImagePdf(jpegBytes, canvas.width, canvas.height);
    const blob = new Blob([pdfBytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // Construit un PDF minimal à une page contenant une seule image JPEG en
  // plein cadre (filtre DCTDecode standard — le JPEG est intégré tel quel,
  // sans ré-encodage). Aucune dépendance externe.
  function buildSingleImagePdf(jpegBytes, width, height) {
    const enc = new TextEncoder();
    const chunks = [];
    let offset = 0;
    const objOffsets = [];
    function push(strOrBytes) {
      const bytes = typeof strOrBytes === "string" ? enc.encode(strOrBytes) : strOrBytes;
      chunks.push(bytes);
      offset += bytes.length;
    }
    push("%PDF-1.4\n");
    objOffsets[1] = offset;
    push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    objOffsets[2] = offset;
    push("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
    objOffsets[3] = offset;
    push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${width} ${height}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
    objOffsets[4] = offset;
    push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
    push(jpegBytes);
    push("\nendstream\nendobj\n");
    const contentStr = `q\n${width} 0 0 ${height} 0 0 cm\n/Im0 Do\nQ`;
    objOffsets[5] = offset;
    push(`5 0 obj\n<< /Length ${enc.encode(contentStr).length} >>\nstream\n${contentStr}\nendstream\nendobj\n`);
    const xrefOffset = offset;
    let xref = "xref\n0 6\n0000000000 65535 f \n";
    for (let i = 1; i <= 5; i++) xref += String(objOffsets[i]).padStart(10, "0") + " 00000 n \n";
    push(xref);
    push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`);

    let total = 0;
    for (const c of chunks) total += c.length;
    const result = new Uint8Array(total);
    let p = 0;
    for (const c of chunks) { result.set(c, p); p += c.length; }
    return result;
  }

  // Dessine les 4 coins "viseur" autour du cadre QR exporté, un coin par
  // couleur de marque, pour reproduire le même repère visuel multicolore
  // que celui affiché à l'écran.
  function drawViewfinderCorners(ctx, x, y, size, len, thickness, colors) {
    const inset = 10;
    ctx.lineWidth = thickness;
    ctx.lineCap = "round";
    const corners = [
      [[x + inset, y + inset + len], [x + inset, y + inset], [x + inset + len, y + inset]],
      [[x + size - inset - len, y + inset], [x + size - inset, y + inset], [x + size - inset, y + inset + len]],
      [[x + inset, y + size - inset - len], [x + inset, y + size - inset], [x + inset + len, y + size - inset]],
      [[x + size - inset - len, y + size - inset], [x + size - inset, y + size - inset], [x + size - inset, y + size - inset - len]]
    ];
    corners.forEach((pts, i) => {
      ctx.strokeStyle = colors[i];
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      ctx.lineTo(pts[1][0], pts[1][1]);
      ctx.lineTo(pts[2][0], pts[2][1]);
      ctx.stroke();
    });
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function init() {
    const token = getToken();
    const user = getUser();

    if (!user || !user.userId || !token) {
      renderLoginGate();
      return;
    }

    try {
      const res = await fetch(CONFIG.API_URL, {
        method: "GET",
        headers: { "Authorization": `Bearer ${token}` }
      });

      let data;
      try {
        data = await res.json();
      } catch (parseErr) {
        // la réponse n'est pas du JSON valide (page d'erreur HTML, blocage
        // en amont du Worker, etc.) — on le signale explicitement plutôt
        // que de laisser planter silencieusement.
        renderServerError(new Error(`Réponse invalide du serveur (statut ${res.status}).`));
        return;
      }

      if (!res.ok || !data.success) {
        if (res.status === 401) {
          localStorage.removeItem("token");
          localStorage.removeItem("user");
          renderLoginGate();
          return;
        }
        if (res.status === 404) {
          renderNoBusiness();
        } else {
          card.innerHTML = `<div class="state-msg"><div class="icon">⚠️</div>${escapeHtml(data.error || "Erreur de chargement.")}</div>`;
        }
        return;
      }

      const entreprise = data.entreprise;
      if (entreprise.Statut === "approuve") {
        renderQR(entreprise);
      } else if (entreprise.Statut === "en_attente") {
        renderPending();
      } else if (entreprise.Statut === "rejete") {
        renderRejected();
      } else {
        renderNoBusiness();
      }

    } catch (err) {
      // fetch a rejeté avant même d'obtenir une réponse : le plus souvent
      // CORS, DNS, ou le Worker injoignable. Le détail ci-dessous aide à
      // distinguer les trois cas sans rouvrir les devtools.
      renderServerError(err);
    }
  }

  init();

</script>
</body>
