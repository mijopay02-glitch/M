html_content = """<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon QR Code — MIJO PAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --blue:#2f8fd6; --teal:#38c2c9; --orange:#ff7a3d; --gold:#ffb648;
    --ink:#141a2b; --ink-soft:#59627a; --line:#e3e7f0; --paper:#ffffff;
    --page-1:#e9eef7; --page-2:#dde6f2;
    --error:#d93f56; --ok:#1f9d6e; --warn:#c97a10;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 800px 460px at 50% -8%, #2f8fd614, transparent),
      radial-gradient(ellipse 600px 420px at 100% 100%, #ff7a3d10, transparent),

    color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:40px 16px;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
  }

  .wrap{max-width:380px; width:100%;}

  /* ---------- Le panneau : titre de marque + logo + QR, façon
     affichette "scannez pour payer" ---------- */
  .card{
    background:var(--paper); border-radius:22px;
    box-shadow:0 30px 60px -24px #1a233530, 0 2px 0 #ffffff inset;
    text-align:center; position:relative;
  }

  .card-body{padding:32px 26px 26px;}

  .headline{
    font-family:'Syne',sans-serif; font-weight:800; font-size:19px; letter-spacing:0.01em;
    text-transform:uppercase; color:var(--ink); margin-bottom:2px;
  }
  .headline .brand-name{
    background:linear-gradient(120deg, var(--orange), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .merchant-title {
    font-family:'Syne',sans-serif; font-weight:700; font-size:22px;
    color:var(--ink); margin-top:12px; margin-bottom:24px;
    letter-spacing:0.02em;
  }

  /* ---------- Cadre QR avec coins "viseur" bleus ---------- */
  .qr-frame{
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px;
    display:inline-flex; align-items:center; justify-content:center;
    margin-bottom:14px; position:relative;
    box-shadow:0 14px 30px -18px #1a233540;
  }
  #qrcode{line-height:0;}
  #qrcode img, #qrcode canvas{border-radius:4px; display:block;}

  .corner{position:absolute; width:26px; height:26px; border:4px solid;}
  .corner.tl{top:8px; left:8px; border-right:none; border-bottom:none; border-radius:8px 0 0 0; border-color:var(--blue);}
  .corner.tr{top:8px; right:8px; border-left:none; border-bottom:none; border-radius:0 8px 0 0; border-color:var(--teal);}
  .corner.bl{bottom:8px; left:8px; border-right:none; border-top:none; border-radius:0 0 0 8px; border-color:var(--orange);}
  .corner.br{bottom:8px; right:8px; border-left:none; border-top:none; border-radius:0 0 8px 0; border-color:var(--gold);}

  .logo-overlay{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:50px; height:50px; border-radius:10px; background:#fff;
    border:3px solid #fff; box-shadow:0 0 0 1px var(--line), 0 2px 8px -2px #1a233540;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .logo-overlay img{width:100%; height:100%; object-fit:contain; padding:2px;}

  .scan-tag{
    display:inline-flex; align-items:center; gap:6px; background:var(--page-1);
    color:var(--ink); font-size:12px; font-weight:700; padding:7px 15px;
    border-radius:100px; margin-bottom:16px;
  }

  .business-id{
    font-family:monospace; font-size:11px; color:var(--ink-soft);
    background:var(--page-1); border:1px solid var(--line); border-radius:8px;
    padding:6px 11px; margin-bottom:18px; display:inline-block;
  }

  /* ---------- Contrôles (hors du panneau imprimable) ---------- */
  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; padding:13px; border-radius:11px; border:none; font-family:'Syne',sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer; transition:filter .15s, transform .15s;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn:hover{filter:brightness(1.06); transform:translateY(-1px);}
  .btn:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  .btn-primary{background:linear-gradient(120deg, var(--orange), var(--gold)); color:#241205;}
  .btn-secondary{background:#fff; color:var(--ink); border:1px solid var(--line);}

  .hint{font-size:12px; color:var(--ink-soft); margin-top:16px; line-height:1.6; text-align:center;}
  .err-detail{font-size:10.5px; color:var(--ink-soft); margin-top:10px; word-break:break-all;}

  .state-msg{text-align:center; padding:40px 26px; color:var(--ink-soft);}
  .state-msg .icon{font-size:26px; margin-bottom:10px;}
  .state-msg .action-link{
    display:inline-block; margin-top:16px; padding:11px 20px; background:var(--blue);
    color:#fff; border-radius:10px; text-decoration:none; font-weight:700; font-size:13px;
    font-family:'Syne',sans-serif;
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    padding:5px 12px; border-radius:100px; margin-bottom:20px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .status-pill.en_attente{background:#c97a1014; color:var(--warn); border:1px solid #c97a1030;}
  .status-pill.rejete{background:#d93f5614; color:var(--error); border:1px solid #d93f5630;}

  /* ---------- Impression : uniquement le panneau, tel un vrai support ---------- */
  @media print{
    body{background:#fff !important; padding:0; display:block;}
    .wrap{max-width:none;}
    .card{box-shadow:none; border-radius:0;}
    .btn-row, .hint{display:none !important;}
    .qr-frame{box-shadow:none; border:1px solid #ccc;}
  }
</style>
</head>

<script>
/* ============================================================
   QR Code Generator for JavaScript
   ============================================================ */
var qrcode = function() {
  var qrcode = function(typeNumber, errorCorrectionLevel) {
    var PAD0 = 0xEC;
    var PAD1 = 0x11;
    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];
    var _this = {};
    var makeImpl = function(test, maskPattern) {
      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);
      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);
      if (_typeNumber >= 7) setupTypeNumber(test);
      if (_dataCache == null) _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      mapData(_dataCache, maskPattern);
    };
    var setupPositionProbePattern = function(row, col) {
      for (var r = -1; r <= 7; r += 1) {
        if (row + r <= -1 || _moduleCount <= row + r) continue;
        for (var c = -1; c <= 7; c += 1) {
          if (col + c <= -1 || _moduleCount <= col + c) continue;
          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) ) || (0 <= c && c <= 6 && (r == 0 || r == 6) ) || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };
    var getBestMaskPattern = function() {
      var minLostPoint = 0;
      var pattern = 0;
      for (var i = 0; i < 8; i += 1) {
        makeImpl(true, i);
        var lostPoint = QRUtil.getLostPoint(_this);
        if (i == 0 || minLostPoint > lostPoint) { minLostPoint = lostPoint; pattern = i; }
      }
      return pattern;
    };
    var setupTimingPattern = function() {
      for (var r = 8; r < _moduleCount - 8; r += 1) { if (_modules[r][6] != null) continue; _modules[r][6] = (r % 2 == 0); }
      for (var c = 8; c < _moduleCount - 8; c += 1) { if (_modules[6][c] != null) continue; _modules[6][c] = (c % 2 == 0); }
    };
    var setupPositionAdjustPattern = function() {
      var pos = QRUtil.getPatternPosition(_typeNumber);
      for (var i = 0; i < pos.length; i += 1) {
        for (var j = 0; j < pos.length; j += 1) {
          var row = pos[i];
          var col = pos[j];
          if (_modules[row][col] != null) continue;
          for (var r = -2; r <= 2; r += 1) {
            for (var c = -2; c <= 2; c += 1) {
              if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };
    var setupTypeNumber = function(test) {
      var bits = QRUtil.getBCHTypeNumber(_typeNumber);
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };
    var setupTypeInfo = function(test, maskPattern) {
      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);
      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 6) _modules[i][8] = mod;
        else if (i < 8) _modules[i + 1][8] = mod;
        else _modules[_moduleCount - 15 + i][8] = mod;
      }
      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 8) _modules[8][_moduleCount - i - 1] = mod;
        else if (i < 9) _modules[8][15 - i - 1 + 1] = mod;
        else _modules[8][15 - i - 1] = mod;
      }
      _modules[_moduleCount - 8][8] = (!test);
    };
    var mapData = function(data, maskPattern) {
      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);
      for (var col = _moduleCount - 1; col > 0; col -= 2) {
        if (col == 6) col -= 1;
        while (true) {
          for (var c = 0; c < 2; c += 1) {
            if (_modules[row][col - c] == null) {
              var dark = false;
              if (byteIndex < data.length) dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              var mask = maskFunc(row, col - c);
              if (mask) dark = !dark;
              _modules[row][col - c] = dark;
              bitIndex -= 1;
              if (bitIndex == -1) { byteIndex += 1; bitIndex = 7; }
            }
          }
          row += inc;
          if (row < 0 || _moduleCount <= row) { row -= inc; inc = -inc; break; }
        }
      }
    };
    var createBytes = function(buffer, rsBlocks) {
      var offset = 0;
      var maxDcCount = 0;
      var maxEcCount = 0;
      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);
      for (var r = 0; r < rsBlocks.length; r += 1) {
        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;
        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);
        dcdata[r] = new Array(dcCount);
        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;
        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);
        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }
      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) totalCodeCount += rsBlocks[i].totalCount;
      var data = new Array(totalCodeCount);
      var index = 0;
      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) { data[index] = dcdata[r][i]; index += 1; }
        }
      }
      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) { data[index] = ecdata[r][i]; index += 1; }
        }
      }
      return data;
    };
    var createData = function(typeNumber, errorCorrectionLevel, dataList) {
      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);
      var buffer = qrBitBuffer();
      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) totalDataCount += rsBlocks[i].dataCount;
      if (buffer.getLengthInBits() > totalDataCount * 8) throw 'code length overflow';
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
      while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
      while (true) {
        if (buffer.getLengthInBits() >= totalDataCount * 8) break;
        buffer.put(PAD0, 8);
        if (buffer.getLengthInBits() >= totalDataCount * 8) break;
        buffer.put(PAD1, 8);
      }
      return createBytes(buffer, rsBlocks);
    };
    _this.addData = function(data, mode) {
      mode = mode || 'Byte';
      var newData = null;
      switch(mode) {
        case 'Byte' : newData = qr8BitByte(data); break;
        default : throw 'mode:' + mode;
      }
      _dataList.push(newData);
      _dataCache = null;
    };
    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) throw row + ',' + col;
      return _modules[row][col];
    };
    _this.getModuleCount = function() { return _moduleCount; };
    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;
        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();
          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }
          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
          if (buffer.getLengthInBits() <= totalDataCount * 8) break;
        }
        _typeNumber = typeNumber;
      }
      makeImpl(false, getBestMaskPattern() );
    };
    return _this;
  };
  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) bytes.push(s.charCodeAt(i) & 0xff);
      return bytes;
    }
  };
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];
  var QRMode = { MODE_8BIT_BYTE : 1 << 2 };
  var QRErrorCorrectionLevel = { L : 1, M : 0, Q : 3, H : 2 };
  var QRMaskPattern = {
    PATTERN000 : 0, PATTERN001 : 1, PATTERN010 : 2, PATTERN011 : 3,
    PATTERN100 : 4, PATTERN101 : 5, PATTERN110 : 6, PATTERN111 : 7
  };
  var QRUtil = function() {
    var PATTERN_POSITION_TABLE = [
      [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42],
      [6, 26, 46], [6, 28, 50], [6, 30, 54], [6, 32, 58], [6, 34, 62], [6, 26, 46, 66],
      [6, 26, 48, 70], [6, 26, 50, 74], [6, 30, 54, 78], [6, 30, 56, 82], [6, 30, 58, 86],
      [6, 34, 62, 90], [6, 28, 50, 72, 94], [6, 26, 50, 74, 98], [6, 30, 54, 78, 102],
      [6, 28, 54, 80, 106], [6, 32, 58, 84, 110], [6, 30, 58, 86, 114], [6, 34, 62, 90, 118],
      [6, 26, 50, 74, 98, 122], [6, 30, 54, 78, 102, 126], [6, 26, 52, 78, 104, 130],
      [6, 30, 56, 82, 108, 134], [6, 34, 60, 86, 112, 138], [6, 30, 58, 86, 114, 142],
      [6, 34, 62, 90, 118, 146], [6, 30, 54, 78, 102, 126, 150], [6, 24, 50, 76, 102, 128, 154],
      [6, 28, 54, 80, 106, 132, 158], [6, 32, 58, 84, 110, 136, 162], [6, 26, 54, 82, 110, 138, 166],
      [6, 30, 58, 86, 114, 142, 170]
    ];
    var G15 = (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0);
    var G18 = (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0);
    var G15_MASK = (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1);
    var _this = {};
    var getBCHDigit = function(data) {
      var digit = 0;
      while (data != 0) { digit += 1; data >>>= 1; }
      return digit;
    };
    _this.getBCHTypeInfo = function(data) {
      var d = data << 10;
      while (getBCHDigit(d) - getBCHDigit(G15) >= 0) d ^= (G15 << (getBCHDigit(d) - getBCHDigit(G15) ) );
      return ( (data << 10) | d) ^ G15_MASK;
    };
    _this.getBCHTypeNumber = function(data) {
      var d = data << 12;
      while (getBCHDigit(d) - getBCHDigit(G18) >= 0) d ^= (G18 << (getBCHDigit(d) - getBCHDigit(G18) ) );
      return (data << 12) | d;
    };
    _this.getPatternPosition = function(typeNumber) { return PATTERN_POSITION_TABLE[typeNumber - 1]; };
    _this.getMaskFunction = function(maskPattern) {
      switch (maskPattern) {
        case QRMaskPattern.PATTERN000 : return function(i, j) { return (i + j) % 2 == 0; };
        case QRMaskPattern.PATTERN001 : return function(i, j) { return i % 2 == 0; };
        case QRMaskPattern.PATTERN010 : return function(i, j) { return j % 3 == 0; };
        case QRMaskPattern.PATTERN011 : return function(i, j) { return (i + j) % 3 == 0; };
        case QRMaskPattern.PATTERN100 : return function(i, j) { return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 == 0; };
        case QRMaskPattern.PATTERN101 : return function(i, j) { return (i * j) % 2 + (i * j) % 3 == 0; };
        case QRMaskPattern.PATTERN110 : return function(i, j) { return ( (i * j) % 2 + (i * j) % 3) % 2 == 0; };
        case QRMaskPattern.PATTERN111 : return function(i, j) { return ( (i * j) % 3 + (i + j) % 2) % 2 == 0; };
        default : throw 'bad maskPattern:' + maskPattern;
      }
    };
    _this.getErrorCorrectPolynomial = function(errorCorrectLength) {
      var a = qrPolynomial([1], 0);
      for (var i = 0; i < errorCorrectLength; i += 1) a = a.multiply(qrPolynomial([1, QRMath.gexp(i)], 0) );
      return a;
    };
    _this.getLengthInBits = function(mode, type) {
      if (1 <= type && type < 10) { return 8; } 
      else if (type < 27) { return 16; } 
      else if (type < 41) { return 16; } 
      else { throw 'type:' + type; }
    };
    _this.getLostPoint = function(qrcode) {
      var moduleCount = qrcode.getModuleCount();
      var lostPoint = 0;
      for (var row = 0; row < moduleCount; row += 1) {
        for (var col = 0; col < moduleCount; col += 1) {
          var sameCount = 0;
          var dark = qrcode.isDark(row, col);
          for (var r = -1; r <= 1; r += 1) {
            if (row + r < 0 || moduleCount <= row + r) continue;
            for (var c = -1; c <= 1; c += 1) {
              if (col + c < 0 || moduleCount <= col + c) continue;
              if (r == 0 && c == 0) continue;
              if (dark == qrcode.isDark(row + r, col + c) ) sameCount += 1;
            }
          }
          if (sameCount > 5) lostPoint += (3 + sameCount - 5);
        }
      }
      for (var row = 0; row < moduleCount - 1; row += 1) {
        for (var col = 0; col < moduleCount - 1; col += 1) {
          var count = 0;
          if (qrcode.isDark(row, col) ) count += 1;
          if (qrcode.isDark(row + 1, col) ) count += 1;
          if (qrcode.isDark(row, col + 1) ) count += 1;
          if (qrcode.isDark(row + 1, col + 1) ) count += 1;
          if (count == 0 || count == 4) lostPoint += 3;
        }
      }
      for (var row = 0; row < moduleCount; row += 1) {
        for (var col = 0; col < moduleCount - 6; col += 1) {
          if (qrcode.isDark(row, col) && !qrcode.isDark(row, col + 1) && qrcode.isDark(row, col + 2) && qrcode.isDark(row, col + 3) && qrcode.isDark(row, col + 4) && !qrcode.isDark(row, col + 5) && qrcode.isDark(row, col + 6) ) {
            lostPoint += 40;
          }
        }
      }
