<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Augmenter mon plafond — MIJO PAY</title>
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0a1120; --navy-900:#0f1830; --navy-800:#16213f;
    --line:#28345a; --orange:#ff6b35; --gold:#ffc266;
    --text-hi:#f4f6fb; --text-mid:#aab4cc; --text-low:#6b769a;
    --error:#ff5c72; --ok:#38d996; --warn:#ffb648;
    --radius-lg:20px; --radius-md:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #ff6b3516, transparent),
      var(--navy-950);
    color:var(--text-hi); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:60px;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    background:var(--navy-900); border-bottom:1px solid var(--line);
    padding:16px 24px; display:flex; align-items:center; gap:12px;
    position:sticky; top:0; z-index:20;
  }
  .back-link{
    color:var(--text-mid); text-decoration:none; font-size:13px; display:flex; align-items:center; gap:6px;
  }
  .back-link:hover{ color:var(--text-hi); }
  .topbar-title{font-family:'Syne',sans-serif; font-weight:700; font-size:14px;}

  .container{max-width:560px; margin:0 auto; padding:28px 20px;}

  .intro{margin-bottom:24px;}
  .intro .eyebrow{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold); margin-bottom:8px;}
  .intro h1{font-family:'Syne',sans-serif; font-weight:800; font-size:22px; margin-bottom:8px;}
  .intro p{font-size:13.5px; color:var(--text-mid); line-height:1.6;}

  .target-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:linear-gradient(135deg, #241a10, var(--navy-900));
    border:1px solid #4a3520; border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:24px;
  }
  .target-card .label{font-size:11.5px; color:var(--text-low); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px;}
  .target-card .value{font-family:'Syne',sans-serif; font-weight:800; font-size:22px;}
  .target-card .value span{color:var(--gold);}
  .target-card .arrow{font-size:22px; color:var(--gold);}

  .state-msg{text-align:center; padding:60px 20px; color:var(--text-mid);}
  .state-msg .icon{font-size:30px; margin-bottom:14px;}
  .state-msg h2{font-family:'Syne',sans-serif; font-size:18px; margin-bottom:8px; color:var(--text-hi);}
  .state-msg p{font-size:13.5px; line-height:1.6; max-width:40ch; margin:0 auto;}
  .action-link{
    display:inline-block; margin-top:18px; padding:12px 22px; background:var(--orange);
    color:var(--navy-950); border-radius:11px; text-decoration:none; font-weight:700; font-size:13.5px;
    font-family:'Syne',sans-serif;
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    padding:5px 13px; border-radius:100px; margin-bottom:18px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .status-pill.en_attente{background:#ffb64818; color:var(--warn); border:1px solid #ffb64840;}
  .status-pill.rejete{background:#ff5c7218; color:var(--error); border:1px solid #ff5c7240;}
  .status-pill.approuve{background:#38d99618; color:var(--ok); border:1px solid #38d99640;}

  form{display:flex; flex-direction:column; gap:22px;}

  .field-group{
    background:var(--navy-900); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px;
  }
  .field-group h3{font-family:'Syne',sans-serif; font-size:14.5px; margin-bottom:4px;}
  .field-group .fg-sub{font-size:12px; color:var(--text-low); margin-bottom:16px; line-height:1.5;}

  label{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; margin-top:14px;}
  label:first-of-type{margin-top:0;}
  input[type="text"], input[type="tel"], textarea{
    width:100%; padding:12px 13px; background:var(--navy-800); border:1px solid var(--line); border-radius:10px;
    color:var(--text-hi); font-size:14px; font-family:'Inter',sans-serif;
  }
  input:focus, textarea:focus{outline:none; border-color:var(--orange);}
  textarea{resize:vertical; min-height:70px;}

  .upload-box{
    border:1.5px dashed var(--line); border-radius:12px; padding:16px; text-align:center;
    cursor:pointer; transition:border-color .15s, background .15s; position:relative;
  }
  .upload-box:hover{border-color:var(--orange); background:var(--navy-800);}
  .upload-box input[type="file"]{
    position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;
  }
  .upload-box .up-icon{font-size:20px; margin-bottom:6px;}
  .upload-box .up-text{font-size:12.5px; color:var(--text-mid);}
  .upload-box .up-hint{font-size:11px; color:var(--text-low); margin-top:2px;}
  .upload-box.has-file{border-color:var(--ok); border-style:solid;}
  .upload-preview{margin-top:10px; display:none;}
  .upload-preview img{max-width:100%; max-height:160px; border-radius:8px; display:block; margin:0 auto;}
  .upload-preview.show{display:block;}
  .upload-filename{font-size:11.5px; color:var(--ok); margin-top:8px;}

  .field-error{color:var(--error); font-size:11.5px; margin-top:6px; display:none;}

  .submit-btn{
    width:100%; padding:15px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(120deg, var(--orange), var(--gold)); color:var(--navy-950);
    font-family:'Syne',sans-serif; font-weight:800; font-size:14.5px;
    transition:filter .15s, transform .15s;
  }
  .submit-btn:hover{filter:brightness(1.06); transform:translateY(-1px);}
  .submit-btn:disabled{opacity:0.55; cursor:not-allowed; transform:none;}

  .form-error{
    background:#ff5c7214; border:1px solid #ff5c7240; color:var(--error);
    border-radius:10px; padding:12px 14px; font-size:12.5px; display:none;
  }
  .form-hint{font-size:11.5px; color:var(--text-low); text-align:center; line-height:1.6;}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="Business.dashbord.html">← Retour au dashboard</a>
</div>

<div class="container" id="container">
  <div class="state-msg"><div class="icon">⏳</div>Chargement…</div>
</div>

<script>
  // ────────────────────────────────────────────────────────────
  // CONFIGURATION — les endpoints ci-dessous sont des repères à
  // brancher sur le Worker réel (même modèle que business-dashboard) :
  //   GET  /plafond/demande      → statut de la demande en cours (ou 404 si aucune)
  //   POST /plafond/demande      → soumet une nouvelle demande (multipart/form-data)
  // ────────────────────────────────────────────────────────────
  const CONFIG = {
    API_URL: "https://business-dashboard.mijocomplexe.workers.dev",
    PLAFOND_CIBLE: 500000,
    DASHBOARD_PAGE: "dashboard-business.html"
  };

  const container = document.getElementById("container");

  function getToken() { return localStorage.getItem("token") || ""; }
  function getUser() {
    try { return JSON.parse(localStorage.getItem("user") || "null"); }
    catch (e) { return null; }
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderLoginGate() {
    container.innerHTML = `
      <div class="state-msg">
        <div class="icon">🔒</div>
        <h2>Connexion requise</h2>
        <p>Connectez-vous à votre compte Business pour faire une demande d'augmentation de plafond.</p>
        <a class="action-link" href="index.html">Se connecter</a>
      </div>`;
  }

  function renderAlreadyAtTarget(plafondActuel) {
    container.innerHTML = `
      <div class="state-msg">
        <span class="status-pill approuve" style="display:inline-flex;">Plafond maximal atteint</span>
        <h2>Vous êtes déjà à ${Number(plafondActuel).toLocaleString()} HTG</h2>
        <p>Votre plafond actuel a déjà atteint (ou dépassé) la cible de ${CONFIG.PLAFOND_CIBLE.toLocaleString()} HTG.</p>
        <a class="action-link" href="${CONFIG.DASHBOARD_PAGE}">Retour au dashboard</a>
      </div>`;
  }

  function renderPendingRequest(demande) {
    container.innerHTML = `
      <div class="state-msg">
        <span class="status-pill en_attente" style="display:inline-flex;">Demande en cours d'examen</span>
        <h2>Votre demande est en cours de traitement</h2>
        <p>Soumise le ${escapeHtml(demande.dateCreation || "")}. Nous vérifions votre patente et votre matricule fiscal — comptez 48 à 72h.</p>
        <a class="action-link" href="${CONFIG.DASHBOARD_PAGE}">Retour au dashboard</a>
      </div>`;
  }

  function renderRejectedRequest(demande) {
    container.innerHTML = `
      <div class="state-msg">
        <span class="status-pill rejete" style="display:inline-flex;">Demande précédente rejetée</span>
        <h2>Votre dernière demande n'a pas été approuvée</h2>
        <p>${demande.motifRejet ? escapeHtml(demande.motifRejet) : "Vérifiez que les documents soumis sont lisibles et à jour, puis soumettez une nouvelle demande."}</p>
      </div>
      ${formHtml()}
    `;
    attachFormHandlers();
  }

  function formHtml() {
    return `
      <div class="target-card">
        <div>
          <div class="label">Votre plafond passera à</div>
          <div class="value"><span>${CONFIG.PLAFOND_CIBLE.toLocaleString()}</span> HTG</div>
        </div>
        <div class="arrow">↑</div>
      </div>

      <form id="plafondForm">
        <div class="field-group">
          <h3>Patente</h3>
          <div class="fg-sub">Le document officiel délivré par la DGI attestant que votre commerce est autorisé à opérer.</div>

          <label for="numeroPatente">Numéro de patente</label>
          <input type="text" id="numeroPatente" name="numeroPatente" placeholder="Ex : 2026-01-123456" required>

          <label>Photo de la patente</label>
          <div class="upload-box" id="boxPatente">
            <input type="file" id="photoPatente" name="photoPatente" accept="image/*,.pdf" required>
            <div class="up-icon">📄</div>
            <div class="up-text">Touchez pour prendre une photo ou choisir un fichier</div>
            <div class="up-hint">JPG, PNG ou PDF — bien lisible</div>
          </div>
          <div class="upload-preview" id="previewPatente"></div>
          <div class="field-error" id="errPatente"></div>
        </div>

        <div class="field-group">
          <h3>Matricule fiscal</h3>
          <div class="fg-sub">Votre numéro d'identification fiscale (NIF) et le document qui l'atteste.</div>

          <label for="numeroMatricule">Numéro de matricule fiscal (NIF)</label>
          <input type="text" id="numeroMatricule" name="numeroMatricule" placeholder="Ex : 006-558-073-6" required>

          <label>Photo du matricule fiscal</label>
          <div class="upload-box" id="boxMatricule">
            <input type="file" id="photoMatricule" name="photoMatricule" accept="image/*,.pdf" required>
            <div class="up-icon">📄</div>
            <div class="up-text">Touchez pour prendre une photo ou choisir un fichier</div>
            <div class="up-hint">JPG, PNG ou PDF — bien lisible</div>
          </div>
          <div class="upload-preview" id="previewMatricule"></div>
          <div class="field-error" id="errMatricule"></div>
        </div>

        <div class="field-group">
          <h3>Informations complémentaires</h3>
          <div class="fg-sub">Facultatif — aide l'équipe à traiter votre demande plus vite.</div>

          <label for="volumeEstime">Volume mensuel estimé de transactions (HTG)</label>
          <input type="text" id="volumeEstime" name="volumeEstime" placeholder="Ex : 300 000">

          <label for="note">Note pour l'équipe MIJO PAY</label>
          <textarea id="note" name="note" placeholder="Contexte utile pour l'examen de votre demande…"></textarea>
        </div>

        <div class="form-error" id="formError"></div>
        <button type="submit" class="submit-btn" id="submitBtn">Soumettre ma demande</button>
        <div class="form-hint">Votre demande est examinée par l'équipe MIJO PAY sous 48 à 72h.</div>
      </form>
    `;
  }

  function wireUploadBox(boxId, inputId, previewId) {
    const box = document.getElementById(boxId);
    const input = document.getElementById(inputId);
    const preview = document.getElementById(previewId);
    if (!box || !input) return;

    input.addEventListener("change", () => {
      const file = input.files && input.files[0];
      if (!file) return;
      box.classList.add("has-file");
      box.querySelector(".up-text").textContent = "Fichier sélectionné — touchez pour changer";

      if (file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = (e) => {
          preview.innerHTML = `<img src="${e.target.result}" alt="Aperçu">
            <div class="upload-filename">✓ ${escapeHtml(file.name)}</div>`;
          preview.classList.add("show");
        };
        reader.readAsDataURL(file);
      } else {
        preview.innerHTML = `<div class="upload-filename">✓ ${escapeHtml(file.name)}</div>`;
        preview.classList.add("show");
      }
    });
  }

  function attachFormHandlers() {
    wireUploadBox("boxPatente", "photoPatente", "previewPatente");
    wireUploadBox("boxMatricule", "photoMatricule", "previewMatricule");

    const form = document.getElementById("plafondForm");
    const submitBtn = document.getElementById("submitBtn");
    const formError = document.getElementById("formError");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.style.display = "none";

      submitBtn.disabled = true;
      submitBtn.textContent = "Envoi en cours…";

      try {
        const fd = new FormData(form);
        fd.append("plafondDemande", String(CONFIG.PLAFOND_CIBLE));

        const res = await fetch(`${CONFIG.API_URL}/plafond/demande`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${getToken()}` },
          body: fd
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          formError.textContent = data.error || "Échec de l'envoi. Vérifiez votre connexion et réessayez.";
          formError.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Soumettre ma demande";
          return;
        }

        container.innerHTML = `
          <div class="state-msg">
            <div class="icon">✅</div>
            <h2>Demande envoyée</h2>
            <p>Votre demande d'augmentation de plafond à ${CONFIG.PLAFOND_CIBLE.toLocaleString()} HTG a bien été reçue. L'équipe MIJO PAY l'examine sous 48 à 72h.</p>
            <a class="action-link" href="${CONFIG.DASHBOARD_PAGE}">Retour au dashboard</a>
          </div>`;

      } catch (err) {
        formError.textContent = "Connexion au serveur impossible. Réessayez dans un instant.";
        formError.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Soumettre ma demande";
      }
    });
  }

  async function init() {
    const token = getToken();
    const user = getUser();

    if (!user || !user.userId || !token) {
      renderLoginGate();
      return;
    }

    try {
      const res = await fetch(`${CONFIG.API_URL}/plafond/demande`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      // 404 = aucune demande en cours, l'entreprise peut en soumettre une.
      if (res.status === 404) {
        container.innerHTML = `
          <div class="intro">
            <div class="eyebrow">Plafond de compte</div>
            <h1>Augmenter mon plafond</h1>
            <p>Soumettez votre patente et votre matricule fiscal pour faire passer votre plafond à ${CONFIG.PLAFOND_CIBLE.toLocaleString()} HTG.</p>
          </div>
          ${formHtml()}
        `;
        attachFormHandlers();
        return;
      }

      const data = await res.json();

      if (!res.ok || !data.success) {
        if (res.status === 401) {
          localStorage.removeItem("token");
          localStorage.removeItem("user");
          renderLoginGate();
          return;
        }
        container.innerHTML = `<div class="state-msg"><div class="icon">⚠️</div><p>${escapeHtml(data.error || "Erreur de chargement.")}</p></div>`;
        return;
      }

      const demande = data.demande;
      const plafondActuel = data.plafondActuel;

      if (plafondActuel && plafondActuel >= CONFIG.PLAFOND_CIBLE) {
        renderAlreadyAtTarget(plafondActuel);
        return;
      }

      if (demande && demande.statut === "en_attente") {
        renderPendingRequest(demande);
        return;
      }

      if (demande && demande.statut === "rejete") {
        container.innerHTML = `
          <div class="intro">
            <div class="eyebrow">Plafond de compte</div>
            <h1>Augmenter mon plafond</h1>
            <p>Soumettez votre patente et votre matricule fiscal pour faire passer votre plafond à ${CONFIG.PLAFOND_CIBLE.toLocaleString()} HTG.</p>
          </div>
        `;
        renderRejectedRequest(demande);
        return;
      }

      // Statut inconnu ou approuvé mais plafond pas encore synchronisé —
      // on retombe sur le formulaire par défaut plutôt que de bloquer l'accès.
      container.innerHTML = `
        <div class="intro">
          <div class="eyebrow">Plafond de compte</div>
          <h1>Augmenter mon plafond</h1>
          <p>Soumettez votre patente et votre matricule fiscal pour faire passer votre plafond à ${CONFIG.PLAFOND_CIBLE.toLocaleString()} HTG.</p>
        </div>
        ${formHtml()}
      `;
      attachFormHandlers();

    } catch (err) {
      container.innerHTML = `<div class="state-msg"><div class="icon">⚠️</div><p>Connexion au serveur impossible.</p></div>`;
    }
  }

  init();
</script>
</body>
</html>
