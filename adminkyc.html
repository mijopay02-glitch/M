<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation KYC | Admin MIJO PAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .doc-thumb { transition: transform 0.15s ease; }
        .doc-thumb:hover { transform: scale(1.03); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- ═══════════════ ÉCRAN DE VERROUILLAGE (mot de passe admin) ═══════════════ -->
    <div id="lockScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full border border-gray-100 text-center">
            <div class="flex items-center justify-center gap-2 mb-6">
                <span class="text-2xl font-black tracking-wider text-gray-900">MIJO<span class="text-red-600">PAY</span></span>
            </div>
            <h1 class="text-lg font-bold text-gray-800 mb-1">Accès administrateur</h1>
            <p class="text-xs text-gray-500 mb-6">Entrez le mot de passe pour accéder aux dossiers KYC.</p>

            <form id="lockForm" class="space-y-3">
                <input
                    type="password"
                    id="adminSecretInput"
                    placeholder="Mot de passe admin"
                    class="w-full p-3.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 text-sm"
                    required
                    autocomplete="off"
                />
                <button
                    type="submit"
                    class="w-full bg-[#cc0000] hover:bg-[#a30000] text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-red-100 transition-all duration-300 text-sm"
                >
                    Déverrouiller
                </button>
            </form>

            <p id="lockError" class="hidden mt-4 text-xs font-semibold text-red-600"></p>
        </div>
    </div>

    <!-- ═══════════════ TABLEAU DE BORD ADMIN ═══════════════ -->
    <div id="dashboard" class="hidden max-w-6xl mx-auto p-4 sm:p-6">
        <header class="flex flex-wrap justify-between items-center gap-4 mb-8 bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-3">
                <span class="text-xl font-black tracking-wider text-gray-900">MIJO<span class="text-red-600">PAY</span></span>
                <span class="text-gray-300">|</span>
                <div>
                    <h1 class="text-lg font-bold text-gray-800 leading-tight">Validation KYC</h1>
                    <p class="text-xs text-gray-500">Dossiers en attente de vérification manuelle</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="pendingCount" class="px-3.5 py-2 bg-amber-100 text-amber-700 font-bold text-xs sm:text-sm rounded-lg whitespace-nowrap">
                    Chargement...
                </div>
                <button onclick="refreshList()" title="Rafraîchir" class="p-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <button onclick="logout()" class="px-3.5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold text-xs rounded-lg transition-colors whitespace-nowrap">
                    Verrouiller
                </button>
            </div>
        </header>

        <div id="loadingState" class="hidden text-center py-16">
            <svg class="animate-spin h-8 w-8 text-red-600 mx-auto mb-3" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-sm text-gray-500 font-medium">Chargement des dossiers...</p>
        </div>

        <div id="networkErrorState" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-100">
            <p class="text-sm text-gray-700 font-semibold mb-1">Impossible de charger les dossiers.</p>
            <p class="text-xs text-gray-500 mb-4">Vérifiez votre connexion, puis réessayez.</p>
            <button onclick="loadPendingKYC()" class="px-4 py-2 bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold rounded-lg transition-colors">
                Réessayer
            </button>
        </div>

        <div id="kycGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div>
    </div>

    <!-- ═══════════════ MODALE APERÇU IMAGE PLEIN ÉCRAN ═══════════════ -->
    <div id="imageModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" onclick="closeImageModal()">
        <img id="imageModalSrc" src="" class="max-h-[90vh] max-w-full rounded-lg shadow-2xl" alt="Aperçu du document">
        <button class="absolute top-5 right-5 text-white/80 hover:text-white text-3xl leading-none">&times;</button>
    </div>

    <script>
        const WORKER_API = "https://kyc.mijocomplexe.workers.dev";
        let pendingCache = [];

        // ═══════════════ GESTION DU VERROUILLAGE ═══════════════
        const lockScreen = document.getElementById('lockScreen');
        const dashboard  = document.getElementById('dashboard');
        const lockError  = document.getElementById('lockError');

        function getAdminSecret() {
            return sessionStorage.getItem('mijo_admin_secret') || '';
        }

        function showLock(message) {
            dashboard.classList.add('hidden');
            lockScreen.classList.remove('hidden');
            if (message) {
                lockError.textContent = message;
                lockError.classList.remove('hidden');
            }
        }

        function showDashboard() {
            lockScreen.classList.add('hidden');
            dashboard.classList.remove('hidden');
        }

        function logout() {
            sessionStorage.removeItem('mijo_admin_secret');
            showLock('');
            lockError.classList.add('hidden');
            document.getElementById('adminSecretInput').value = '';
        }

        document.getElementById('lockForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const value = document.getElementById('adminSecretInput').value.trim();
            if (!value) return;

            sessionStorage.setItem('mijo_admin_secret', value);
            lockError.classList.add('hidden');

            // On teste le mot de passe directement avec un vrai appel
            const ok = await loadPendingKYC();
            if (ok) {
                showDashboard();
            } else {
                sessionStorage.removeItem('mijo_admin_secret');
            }
        });

        // ═══════════════ CHARGEMENT DES DOSSIERS ═══════════════
        async function loadPendingKYC() {
            const grid = document.getElementById('kycGrid');
            const loadingState = document.getElementById('loadingState');
            const networkErrorState = document.getElementById('networkErrorState');

            grid.innerHTML = '';
            networkErrorState.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                const res = await fetch(`${WORKER_API}/admin/get-pending`, {
                    headers: { 'X-Admin-Secret': getAdminSecret() }
                });

                if (res.status === 403) {
                    loadingState.classList.add('hidden');
                    showLock('Mot de passe incorrect. Réessayez.');
                    return false;
                }

                if (!res.ok) throw new Error('server_error');

                const json = await res.json();
                loadingState.classList.add('hidden');

                if (json.success) {
                    pendingCache = json.data || [];
                    renderGrid(pendingCache);
                    return true;
                } else {
                    throw new Error(json.error || 'unknown');
                }
            } catch (err) {
                loadingState.classList.add('hidden');
                networkErrorState.classList.remove('hidden');
                return false;
            }
        }

        function refreshList() {
            loadPendingKYC();
        }

        function renderGrid(data) {
            const grid = document.getElementById('kycGrid');
            const countEl = document.getElementById('pendingCount');
            grid.innerHTML = '';

            if (!data || data.length === 0) {
                countEl.textContent = "0 dossier en attente";
                countEl.className = "px-3.5 py-2 bg-green-100 text-green-700 font-bold text-xs sm:text-sm rounded-lg whitespace-nowrap";
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-2xl border border-gray-100">
                        <p class="text-sm font-semibold text-gray-700 mb-1">Aucun dossier en attente</p>
                        <p class="text-xs text-gray-500">Tous les dossiers KYC ont été traités.</p>
                    </div>`;
                return;
            }

            countEl.textContent = `${data.length} dossier${data.length > 1 ? 's' : ''} en attente`;
            countEl.className = "px-3.5 py-2 bg-amber-100 text-amber-700 font-bold text-xs sm:text-sm rounded-lg whitespace-nowrap";

            data.forEach(user => {
                const docs = user.kyc_document_url ? user.kyc_document_url.split(',') : [];
                const rectoUrl  = (docs[0] || '').trim();
                const versoUrl  = (docs[1] || '').trim();
                const selfieUrl = user.kyc_selfie_url || '';
                const fullName  = `${user.Nom || ''} ${user.Prenom || ''}`.trim() || 'Nom non renseigné';

                const card = document.createElement('div');
                card.className = "bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-200 fade-in";
                card.id = `card-${user.userId}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4 gap-2">
                        <h2 class="text-base font-bold text-gray-800">${escapeHtml(fullName)}</h2>
                        <span class="text-[10px] font-mono text-gray-400 bg-gray-50 px-2 py-1 rounded shrink-0">${escapeHtml(user.userId)}</span>
                    </div>

                    <div class="grid grid-cols-3 gap-3 mb-5">
                        ${docThumb(rectoUrl, 'Recto')}
                        ${docThumb(versoUrl, 'Verso')}
                        ${docThumb(selfieUrl, 'Selfie')}
                    </div>

                    <div class="flex gap-2.5">
                        <button
                            class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl transition-colors text-xs sm:text-sm disabled:opacity-50 disabled:cursor-not-allowed"
                            onclick="updateStatus('${user.userId}', 'verifier', this)"
                        >
                            ✅ Valider (100k HTG)
                        </button>
                        <button
                            class="flex-1 bg-red-50 hover:bg-red-100 text-red-700 font-bold py-2.5 rounded-xl transition-colors text-xs sm:text-sm disabled:opacity-50 disabled:cursor-not-allowed"
                            onclick="updateStatus('${user.userId}', 'non_verifier', this)"
                        >
                            ❌ Rejeter
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function docThumb(url, label) {
            if (!url) {
                return `
                    <div>
                        <p class="text-[10px] text-gray-500 mb-1 font-semibold uppercase">${label}</p>
                        <div class="w-full h-28 flex items-center justify-center bg-gray-50 rounded-lg border border-dashed border-gray-300 text-[10px] text-gray-400">
                            Manquant
                        </div>
                    </div>`;
            }
            return `
                <div>
                    <p class="text-[10px] text-gray-500 mb-1 font-semibold uppercase">${label}</p>
                    <img
                        src="${url}"
                        onclick="openImageModal('${url}')"
                        class="doc-thumb w-full h-28 object-cover rounded-lg border border-gray-200 cursor-zoom-in"
                        alt="${label}"
                        loading="lazy"
                    >
                </div>`;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ═══════════════ APERÇU PLEIN ÉCRAN ═══════════════
        function openImageModal(url) {
            document.getElementById('imageModalSrc').src = url;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('imageModalSrc').src = '';
        }

        // ═══════════════ VALIDATION / REJET ═══════════════
        async function updateStatus(userId, newStatus, btnEl) {
            const confirmMsg = newStatus === 'verifier'
                ? "Valider ce dossier ? Le plafond de l'utilisateur passera à 100 000 HTG."
                : "Rejeter ce dossier ? Le plafond restera à 5 000 HTG par transaction.";

            if (!confirm(confirmMsg)) return;

            const card = document.getElementById(`card-${userId}`);
            const buttons = card.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
            const originalText = btnEl.textContent;
            btnEl.textContent = "Traitement...";

            try {
                const res = await fetch(`${WORKER_API}/admin/update-status`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Secret': getAdminSecret()
                    },
                    body: JSON.stringify({ userId, newStatus })
                });

                if (res.status === 403) {
                    showLock('Session admin expirée. Reconnectez-vous.');
                    return;
                }

                const data = await res.json();

                if (data.success) {
                    card.style.opacity = '0.4';
                    card.style.pointerEvents = 'none';
                    setTimeout(() => {
                        pendingCache = pendingCache.filter(u => u.userId !== userId);
                        renderGrid(pendingCache);
                    }, 300);
                } else {
                    throw new Error(data.error || 'Erreur inconnue');
                }
            } catch (err) {
                alert(`Erreur : ${err.message}`);
                buttons.forEach(b => b.disabled = false);
                btnEl.textContent = originalText;
            }
        }

        // ═══════════════ INITIALISATION ═══════════════
        (async function init() {
            if (getAdminSecret()) {
                const ok = await loadPendingKYC();
                if (ok) {
                    showDashboard();
                } else {
                    showLock('');
                }
            } else {
                showLock('');
            }
        })();
    </script>
</body>
</html>
