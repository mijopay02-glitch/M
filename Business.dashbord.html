<!DOCTYPE html>
<html lang="fr">
<head>
     <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1255C0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Business — MIJO PAY</title>

<!-- Durcissement côté page. NOTE : pas de frame-ancestors ici — les
     navigateurs l'ignorent en balise <meta>, seul un en-tête HTTP réel
     fonctionne. Pour une vraie protection anti-clickjacking, servez
     cette page via un petit Worker dédié (même modèle que pay-page). -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://*.supabase.co data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src https://business-dashboard.mijocomplexe.workers.dev https://retrait-moncash-connect.mijocomplexe.workers.dev https://static.cloudflareinsights.com;">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0a1120; --navy-900:#0f1830; --navy-800:#16213f; --navy-700:#1d2a4d;
    --line:#28345a; --line-soft:#1c2745;
    --orange:#ff6b35; --orange-dim:#ff6b3522;
    --gold:#ffc266; --gold-dim:#ffc26622;
    --text-hi:#f4f6fb; --text-mid:#aab4cc; --text-low:#6b769a;
    --error:#ff5c72; --ok:#38d996; --warn:#ffb648;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #ff6b3516, transparent),
      radial-gradient(ellipse 700px 400px at 90% 15%, #ffc26610, transparent),
      var(--navy-950);
    color:var(--text-hi); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:70px;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Topbar ---------- */
  .topbar{
    background:var(--navy-900); border-bottom:1px solid var(--line);
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    position:sticky; top:0; z-index:20; backdrop-filter:blur(6px);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{width:30px; height:30px; border-radius:8px; object-fit:cover;}
  .brand-mark{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--orange),var(--gold));
    display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:800; font-size:13px; color:var(--navy-950); flex:none;}
  .brand-title{font-family:'Syne',sans-serif; font-weight:700; font-size:14px;}
  .brand-title span{color:var(--orange);}
  .business-name{font-size:12.5px; color:var(--text-low);}
  .logout-btn{
    background:transparent; border:1px solid var(--line); color:var(--text-mid); padding:8px 14px;
    border-radius:9px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .logout-btn:hover{border-color:var(--error); color:var(--error);}
  .logout-btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible{
    outline:2px solid var(--orange); outline-offset:2px;
  }

  .container{max-width:960px; margin:0 auto; padding:28px 20px;}

  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .fade-in{animation:fadeUp .45s ease both;}
  .fade-in.d1{animation-delay:.03s;} .fade-in.d2{animation-delay:.08s;}
  .fade-in.d3{animation-delay:.13s;} .fade-in.d4{animation-delay:.18s;}

  /* ---------- Generic state message ---------- */
  .state-msg{text-align:center; padding:100px 20px; color:var(--text-mid);}
  .state-msg .icon{font-size:30px; margin-bottom:14px;}
  .state-msg h2{font-family:'Syne',sans-serif; font-size:19px; margin-bottom:8px; color:var(--text-hi);}
  .state-msg p{font-size:13.5px; line-height:1.6; max-width:40ch; margin:0 auto;}
  .action-link{
    display:inline-block; margin-top:20px; padding:12px 22px; background:var(--orange);
    color:var(--navy-950); border-radius:11px; text-decoration:none; font-weight:700; font-size:13.5px;
    font-family:'Syne',sans-serif;
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    padding:5px 13px; border-radius:100px; margin-bottom:18px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .status-pill.en_attente{background:#ffb64818; color:var(--warn); border:1px solid #ffb64840;}
  .status-pill.rejete{background:#ff5c7218; color:var(--error); border:1px solid #ff5c7240;}

  /* ---------- Stat cards + gauge ---------- */
  .cards-row{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:14px; margin-bottom:20px;}
  @media (max-width:640px){ .cards-row{grid-template-columns:1fr;} }
  .stat-card{
    background:linear-gradient(160deg, var(--navy-900), var(--navy-800));
    border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .stat-card .label{font-size:11.5px; color:var(--text-low); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;}
  .stat-card .value{font-family:'Syne',sans-serif; font-weight:800; font-size:23px; line-height:1.1;}
  .stat-card .sub{font-size:11.5px; color:var(--text-low); margin-top:4px;}
  .stat-card.balance .value{color:var(--orange);}
  .gauge-wrap{flex:none; position:relative; width:64px; height:64px;}
  .gauge-wrap svg{transform:rotate(-90deg);}
  .gauge-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-family:'Syne',sans-serif; color:var(--text-mid);}

  /* ---------- Encaissement (QR) hero — signature element ---------- */
  .qr-hero{
    position:relative; margin-bottom:22px; border-radius:var(--radius-lg); overflow:hidden;
    background:linear-gradient(135deg, #241a10, var(--navy-900) 55%, var(--navy-800));
    border:1px solid #4a3520;
  }
  .qr-hero::before, .qr-hero::after{
    content:""; position:absolute; top:50%; width:26px; height:26px; border-radius:50%;
    background:var(--navy-950); transform:translateY(-50%); z-index:2;
  }
  .qr-hero::before{ left:-13px; }
  .qr-hero::after{ right:-13px; }
  .qr-hero-inner{
    display:flex; align-items:center; gap:22px; padding:26px 30px;
    border-top:2px dashed #6b4f2c; border-bottom:2px dashed #6b4f2c;
  }
  @media (max-width:640px){ .qr-hero-inner{flex-direction:column; text-align:center; padding:24px 22px;} }
  .qr-icon-badge{
    flex:none; width:76px; height:76px; border-radius:18px;
    background:radial-gradient(circle at 35% 30%, var(--gold), var(--orange) 70%);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .qr-icon-badge svg{width:38px; height:38px;}
  .qr-pulse{
    position:absolute; inset:-6px; border-radius:22px; border:2px solid var(--gold);
    opacity:0; animation:pulseRing 2.6s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{opacity:.55; transform:scale(0.94);}
    70%{opacity:0; transform:scale(1.18);}
    100%{opacity:0; transform:scale(1.18);}
  }
  .qr-hero-text{flex:1;}
  .qr-eyebrow{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold); margin-bottom:6px;}
  .qr-hero-text h2{font-family:'Syne',sans-serif; font-size:19px; margin-bottom:6px;}
  .qr-hero-text p{font-size:13px; color:var(--text-mid); line-height:1.55; max-width:46ch;}
  @media (max-width:640px){ .qr-hero-text p{max-width:none;} }
  .qr-cta{
    flex:none; display:inline-flex; align-items:center; gap:8px; padding:14px 22px;
    background:linear-gradient(135deg, var(--gold), var(--orange)); color:var(--navy-950);
    border-radius:12px; font-family:'Syne',sans-serif; font-weight:800; font-size:13.5px;
    text-decoration:none; white-space:nowrap; box-shadow:0 8px 24px -8px #ff6b3560;
    transition:transform .15s, box-shadow .15s;
  }
  .qr-cta:hover{ transform:translateY(-2px); box-shadow:0 12px 28px -8px #ff6b3580; }

  /* ---------- Plafond banner ---------- */
  .plafond-banner{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:var(--navy-900); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:16px 20px; margin-bottom:22px;
  }
  .plafond-banner-text{display:flex; align-items:center; gap:12px;}
  .plafond-banner-icon{
    flex:none; width:38px; height:38px; border-radius:10px; background:var(--gold-dim);
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .plafond-banner-text h4{font-family:'Syne',sans-serif; font-size:13.5px; margin-bottom:2px;}
  .plafond-banner-text p{font-size:12px; color:var(--text-low);}
  .plafond-cta{
    flex:none; display:inline-flex; align-items:center; gap:6px; padding:10px 16px;
    background:transparent; border:1px solid var(--orange); color:var(--orange);
    border-radius:10px; font-family:'Syne',sans-serif; font-weight:700; font-size:12.5px;
    text-decoration:none; white-space:nowrap; transition:background .15s, color .15s;
  }
  .plafond-cta:hover{ background:var(--orange); color:var(--navy-950); }

  /* ---------- Withdraw row ---------- */
  .section-label{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-low);
    margin:0 0 12px 2px;
  }
  .withdraw-row{display:flex; gap:12px; margin-bottom:26px; flex-wrap:wrap;}
  .withdraw-btn{
    flex:1; min-width:220px; padding:16px; border-radius:var(--radius-md); border:1px solid var(--line);
    background:var(--navy-900); color:var(--text-hi); cursor:pointer; font-family:'Inter',sans-serif;
    text-align:left; transition:border-color .15s, background .15s, transform .15s;
  }
  .withdraw-btn:hover{border-color:var(--orange); background:var(--navy-800); transform:translateY(-1px);}
  .withdraw-btn .wb-title{font-family:'Syne',sans-serif; font-weight:700; font-size:14px; margin-bottom:4px;}
  .withdraw-btn .wb-sub{font-size:12px; color:var(--text-low);}

  /* ---------- Activity chart ---------- */
  .chart-card{
    background:var(--navy-900); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:20px 22px 16px; margin-bottom:26px;
  }
  .chart-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:6px;}
  .chart-head h3{font-family:'Syne',sans-serif; font-size:14.5px;}
  .chart-head .chart-total{font-size:12px; color:var(--text-low);}
  .bars{display:flex; align-items:flex-end; gap:10px; height:110px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
  .bar-col .bar{
    width:100%; max-width:34px; border-radius:6px 6px 3px 3px;
    background:linear-gradient(180deg, var(--gold), var(--orange));
    min-height:4px; transition:height .5s cubic-bezier(.3,.9,.4,1);
  }
  .bar-col .bar.zero{background:var(--line-soft);}
  .bar-col .day-label{font-size:10.5px; color:var(--text-low); margin-top:2px;}

  .section-title{font-family:'Syne',sans-serif; font-weight:700; font-size:15px; margin-bottom:14px;}

  /* ---------- Transaction table ---------- */
  .tx-table{width:100%; border-collapse:collapse; background:var(--navy-900); border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden;}
  .tx-table th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-low);
    padding:12px 16px; border-bottom:1px solid var(--line); background:var(--navy-800);
  }
  .tx-table td{padding:13px 16px; font-size:13px; border-bottom:1px solid var(--line); vertical-align:top;}
  .tx-table tr:last-child td{border-bottom:none;}
  .tx-table tr{transition:background .12s;}
  .tx-table tbody tr:hover{background:var(--navy-800);}
  .tx-amount{font-weight:700; color:var(--ok);}
  .tx-badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:100px; text-transform:uppercase; white-space:nowrap;}
  .tx-badge.ok{background:#38d99618; color:var(--ok);}
  .tx-badge.warn{background:#ffb64818; color:var(--warn);}
  .tx-badge.err{background:#ff5c7218; color:var(--error);}
  .tx-desc{color:var(--text-low); font-size:11.5px; margin-top:2px; max-width:260px;}
  .empty-history{text-align:center; padding:40px 20px; color:var(--text-low); font-size:13px;}

  /* mobile-friendly table: switch to stacked cards below 560px so the
     phone view carries the exact same information as desktop, just reflowed */
  @media (max-width:560px){
    .tx-table thead{display:none;}
    .tx-table, .tx-table tbody, .tx-table tr, .tx-table td{display:block; width:100%;}
    .tx-table tr{padding:13px 16px; border-bottom:1px solid var(--line);}
    .tx-table td{padding:3px 0; border:none; display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
    .tx-table td::before{content:attr(data-label); color:var(--text-low); font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; flex:none; padding-top:2px;}
    .tx-table td.tx-td-type{display:block;}
    .tx-table td.tx-td-type::before{display:block; margin-bottom:3px;}
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:#00000090; z-index:50;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--navy-900); border:1px solid var(--line); border-radius:18px; padding:26px;
    max-width:380px; width:100%; animation:fadeUp .25s ease both;
  }
  .modal h3{font-family:'Syne',sans-serif; font-size:17px; margin-bottom:6px;}
  .modal .modal-sub{font-size:12.5px; color:var(--text-low); margin-bottom:18px; line-height:1.5;}
  .modal label{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; margin-top:14px;}
  .modal input{
    width:100%; padding:12px 13px; background:var(--navy-800); border:1px solid var(--line); border-radius:10px;
    color:var(--text-hi); font-size:14px; font-family:'Inter',sans-serif;
  }
  .modal input:focus{outline:none; border-color:var(--orange);}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-btn{
    flex:1; padding:12px; border-radius:10px; border:none; font-family:'Syne',sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .modal-btn.confirm{background:var(--orange); color:var(--navy-950);}
  .modal-btn.cancel{background:transparent; color:var(--text-mid); border:1px solid var(--line);}
  .modal-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .modal-error{color:var(--error); font-size:12.5px; margin-top:10px; display:none;}
  .modal-success{color:var(--ok); font-size:12.5px; margin-top:10px; display:none; line-height:1.5;}
  .modal-success .action-link{margin-top:12px; display:inline-block; padding:9px 16px; font-size:12.5px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" id="brandBlock">
    <div class="brand-mark">M</div>
    <div>
      <div class="brand-title">MIJO <span>PAY</span> — Business</div>
      <div class="business-name" id="businessNameTag"></div>
    </div>
  </div>
  <button class="logout-btn" id="logoutBtn">Déconnexion</button>
</div>

<div class="container" id="container">
  <div class="state-msg"><div class="icon">⏳</div>Chargement…</div>
</div>

<div class="modal-overlay" id="withdrawModal">
  <div class="modal">
    <h3>Retirer vers mon compte personnel</h3>
    <p class="modal-sub">Le montant est transféré immédiatement vers votre solde personnel MIJO PAY. Vous pourrez ensuite le retirer vers MonCash depuis votre compte personnel.</p>

    <label for="withdrawAmount">Montant (HTG)</label>
    <input type="number" id="withdrawAmount" min="100" placeholder="Ex : 500">

    <div class="modal-error" id="withdrawError"></div>
    <div class="modal-success" id="withdrawSuccess"></div>

    <div class="modal-actions" id="withdrawActions">
      <button class="modal-btn cancel" id="withdrawCancel">Annuler</button>
      <button class="modal-btn confirm" id="withdrawConfirm">Confirmer</button>
    </div>
  </div>
</div>

<script>
  const CONFIG = {
    API_URL: "https://business-dashboard.mijocomplexe.workers.dev",
    MONCASH_WITHDRAW_PAGE: "retrait-moncash.html",
    SUBMIT_BUSINESS_PAGE: "https://mijopay.com/submit.html",
    QR_PAGE: "qr.html",
    PLAFOND_PAGE: "augmenter-plafond.html",
    PLAFOND_CIBLE: 500000
  };

  const container = document.getElementById("container");
  const businessNameTag = document.getElementById("businessNameTag");
  const withdrawModal = document.getElementById("withdrawModal");
  const withdrawAmount = document.getElementById("withdrawAmount");
  const withdrawError = document.getElementById("withdrawError");
  const withdrawSuccess = document.getElementById("withdrawSuccess");
  const withdrawActions = document.getElementById("withdrawActions");
  const withdrawConfirm = document.getElementById("withdrawConfirm");
  const withdrawCancel = document.getElementById("withdrawCancel");

  let overviewData = null;

  function getToken() { return localStorage.getItem("token") || ""; }
  function getUser() {
    try { return JSON.parse(localStorage.getItem("user") || "null"); }
    catch (e) { return null; }
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function formatDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) +
      " · " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  function badgeClass(statut) {
    const s = (statut || "").toLowerCase();
    if (["complété", "payé", "réussi", "reçu"].includes(s)) return "ok";
    if (["échoué", "refusé", "annulé"].includes(s)) return "err";
    return "warn";
  }

  function renderLoginGate() {
    container.innerHTML = `
      <div class="state-msg">
        <div class="icon">🔒</div>
        <h2>Connexion requise</h2>
        <p>Connectez-vous à votre compte pour accéder au dashboard Business.</p>
        <a class="action-link" href="index.html">Se connecter</a>
      </div>`;
  }

  function renderNotRegistered() {
    container.innerHTML = `
      <div class="state-msg">
        <div class="icon">🏪</div>
        <h2>Entreprise non enregistrée</h2>
        <p>Ce compte n'a pas encore de compte Business associé sur MIJO PAY.</p>
        <a class="action-link" href="${CONFIG.SUBMIT_BUSINESS_PAGE}">Soumettre mon entreprise</a>
      </div>`;
  }

  function renderPending(nom) {
    container.innerHTML = `
      <div class="state-msg">
        <span class="status-pill en_attente" style="display:inline-flex;">En attente d'approbation</span>
        <h2>${escapeHtml(nom || "Votre entreprise")}</h2>
        <p>Votre demande est en cours d'examen (48 à 72h). Le dashboard sera disponible dès l'approbation.</p>
      </div>`;
  }

  function renderRejected(nom) {
    container.innerHTML = `
      <div class="state-msg">
        <span class="status-pill rejete" style="display:inline-flex;">Demande rejetée</span>
        <h2>${escapeHtml(nom || "Votre entreprise")}</h2>
        <p>Votre demande n'a pas été approuvée. Contactez le support pour plus de détails, ou soumettez une nouvelle demande.</p>
        <a class="action-link" href="${CONFIG.SUBMIT_BUSINESS_PAGE}">Nouvelle demande</a>
      </div>`;
  }

  // ---- Jauge circulaire : solde utilisé vs plafond ----
  function buildGauge(solde, plafond) {
    if (!plafond || plafond <= 0) return "";
    const pct = Math.max(0, Math.min(100, Math.round((solde / plafond) * 100)));
    const r = 26, c = 2 * Math.PI * r;
    const offset = c - (pct / 100) * c;
    const color = pct >= 90 ? "var(--error)" : pct >= 65 ? "var(--warn)" : "var(--ok)";
    return `
      <div class="gauge-wrap" title="${pct}% du plafond utilisé">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"></circle>
          <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="gauge-pct">${pct}%</div>
      </div>`;
  }

  // ---- Graphique en barres : encaissements des 7 derniers jours ----
  function buildWeekChart(historique) {
    const days = [];
    const now = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(now.getDate() - i);
      days.push({ key: d.toDateString(), label: d.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", ""), total: 0 });
    }
    const byKey = Object.fromEntries(days.map(d => [d.key, d]));
    (historique || []).forEach(tx => {
      if (!tx.Date) return;
      const s = (tx.Statut || "").toLowerCase();
      if (["échoué", "refusé", "annulé"].includes(s)) return;
      const key = new Date(tx.Date).toDateString();
      if (byKey[key]) byKey[key].total += Number(tx.Montant || 0);
    });
    const max = Math.max(1, ...days.map(d => d.total));
    const totalWeek = days.reduce((a, d) => a + d.total, 0);
    const barsHtml = days.map(d => {
      const h = d.total > 0 ? Math.max(6, Math.round((d.total / max) * 100)) : 0;
      return `
        <div class="bar-col">
          <div class="bar ${d.total > 0 ? "" : "zero"}" style="height:${d.total > 0 ? h : 3}%" title="${d.total.toLocaleString()} HTG"></div>
          <div class="day-label">${d.label}</div>
        </div>`;
    }).join("");
    return { barsHtml, totalWeek };
  }

  // ---- Bandeau "augmenter mon plafond" : affiché seulement si le plafond
  // actuel n'a pas déjà atteint la cible (évite de proposer une hausse à
  // quelqu'un qui l'a déjà). ----
  function buildPlafondBanner(plafond) {
    if (plafond && plafond >= CONFIG.PLAFOND_CIBLE) return "";
    return `
      <div class="plafond-banner fade-in d2">
        <div class="plafond-banner-text">
          <div class="plafond-banner-icon">📈</div>
          <div>
            <h4>Augmentez votre plafond</h4>
            <p>Passez à ${CONFIG.PLAFOND_CIBLE.toLocaleString()} HTG en soumettant votre patente et votre matricule fiscal.</p>
          </div>
        </div>
        <a class="plafond-cta" href="${CONFIG.PLAFOND_PAGE}">Augmenter mon plafond →</a>
      </div>`;
  }

  function renderDashboard(data) {
    const ent = data.entreprise;
    const stats = data.stats;
    const historique = data.historique || [];

    businessNameTag.textContent = ent.NomCommercial;
    if (ent.LogoURL) {
      document.getElementById("brandBlock").querySelector(".brand-mark").outerHTML =
        `<img src="${ent.LogoURL}" alt="">`;
    }

    const historiqueHtml = historique.length === 0
      ? `<div class="empty-history">Aucune transaction pour le moment. Partagez votre QR pour recevoir votre premier paiement.</div>`
      : `<table class="tx-table">
          <thead><tr><th>Date</th><th>Type</th><th>Montant</th><th>Statut</th></tr></thead>
          <tbody>
            ${historique.map(tx => `
              <tr>
                <td data-label="Date">${formatDate(tx.Date)}</td>
                <td data-label="Type" class="tx-td-type">${escapeHtml(tx.TypeTransaction || "—")}${tx.Description ? `<div class="tx-desc">${escapeHtml(tx.Description.slice(0, 80))}</div>` : ""}</td>
                <td data-label="Montant" class="tx-amount">${Number(tx.Montant || 0).toLocaleString()} ${escapeHtml(tx.Devise || "HTG")}</td>
                <td data-label="Statut"><span class="tx-badge ${badgeClass(tx.Statut)}">${escapeHtml(tx.Statut || "—")}</span></td>
              </tr>
            `).join("")}
          </tbody>
        </table>`;

    const gaugeHtml = buildGauge(ent.Solde, ent.PlafondSolde);
    const { barsHtml, totalWeek } = buildWeekChart(historique);

    container.innerHTML = `
      <div class="cards-row fade-in d1">
        <div class="stat-card balance">
          <div>
            <div class="label">Solde Business</div>
            <div class="value">${ent.Solde.toLocaleString()} HTG</div>
            ${ent.PlafondSolde ? `<div class="sub">Plafond : ${Number(ent.PlafondSolde).toLocaleString()} HTG</div>` : ""}
          </div>
          ${gaugeHtml}
        </div>
        <div class="stat-card">
          <div>
            <div class="label">Aujourd'hui</div>
            <div class="value">${stats.totalAujourdhui.toLocaleString()} HTG</div>
            <div class="sub">${stats.nombreAujourdhui} transaction(s)</div>
          </div>
        </div>
        <div class="stat-card">
          <div>
            <div class="label">Ce mois-ci</div>
            <div class="value">${stats.totalMois.toLocaleString()} HTG</div>
            <div class="sub">${stats.nombreMois} transaction(s)</div>
          </div>
        </div>
      </div>

      ${buildPlafondBanner(ent.PlafondSolde)}

      <div class="qr-hero fade-in d2">
        <div class="qr-hero-inner">
          <div class="qr-icon-badge">
            <div class="qr-pulse"></div>
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="7" height="7" rx="1.2" stroke="#0a1120" stroke-width="1.8"/>
              <rect x="14" y="3" width="7" height="7" rx="1.2" stroke="#0a1120" stroke-width="1.8"/>
              <rect x="3" y="14" width="7" height="7" rx="1.2" stroke="#0a1120" stroke-width="1.8"/>
              <rect x="14.5" y="14.5" width="2.5" height="2.5" fill="#0a1120"/>
              <rect x="18.5" y="14.5" width="2.5" height="2.5" fill="#0a1120"/>
              <rect x="14.5" y="18.5" width="2.5" height="2.5" fill="#0a1120"/>
              <rect x="18.5" y="18.5" width="2.5" height="2.5" fill="#0a1120"/>
            </svg>
          </div>
          <div class="qr-hero-text">
            <div class="qr-eyebrow">Encaisser</div>
            <h2>Affichez votre QR de paiement</h2>
            <p>Vos clients scannent ce code avec MIJO PAY pour vous payer directement — pas de terminal, pas de monnaie à rendre.</p>
          </div>
          <a class="qr-cta" href="${CONFIG.QR_PAGE}">
            Voir mon QR
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </div>

      <div class="section-label">Gérer mes fonds</div>
      <div class="withdraw-row fade-in d3">
        <button class="withdraw-btn" id="openWithdrawBtn">
          <div class="wb-title">↓ Retirer vers mon compte MIJO PAY</div>
          <div class="wb-sub">Transfert immédiat vers votre solde personnel</div>
        </button>
        <a class="withdraw-btn" href="${CONFIG.MONCASH_WITHDRAW_PAGE}" style="text-decoration:none; display:block;">
          <div class="wb-title">📱 Retirer vers MonCash</div>
          <div class="wb-sub">Depuis votre compte personnel, après transfert</div>
        </a>
      </div>

      <div class="chart-card fade-in d3">
        <div class="chart-head">
          <h3>Encaissements — 7 derniers jours</h3>
          <div class="chart-total">${totalWeek.toLocaleString()} HTG au total</div>
        </div>
        <div class="bars">${barsHtml}</div>
      </div>

      <div class="section-title fade-in d4">Historique des transactions</div>
      <div class="fade-in d4">${historiqueHtml}</div>
    `;

    document.getElementById("openWithdrawBtn").addEventListener("click", openWithdrawModal);
  }

  function openWithdrawModal() {
    withdrawAmount.value = "";
    withdrawError.style.display = "none";
    withdrawSuccess.style.display = "none";
    withdrawActions.style.display = "flex";
    withdrawAmount.disabled = false;
    withdrawModal.classList.add("show");
    withdrawAmount.focus();
  }

  function closeWithdrawModal() {
    withdrawModal.classList.remove("show");
  }

  withdrawCancel.addEventListener("click", closeWithdrawModal);
  withdrawModal.addEventListener("click", (e) => { if (e.target === withdrawModal) closeWithdrawModal(); });

  withdrawConfirm.addEventListener("click", async () => {
    const amount = parseFloat(withdrawAmount.value);
    withdrawError.style.display = "none";

    if (isNaN(amount) || amount < 100) {
      withdrawError.textContent = "Montant minimum : 100 HTG.";
      withdrawError.style.display = "block";
      return;
    }

    if (overviewData && amount > overviewData.entreprise.Solde) {
      withdrawError.textContent = "Solde insuffisant pour ce retrait.";
      withdrawError.style.display = "block";
      return;
    }

    withdrawConfirm.disabled = true;
    withdrawCancel.disabled = true;
    withdrawAmount.disabled = true;
    withdrawConfirm.textContent = "Traitement…";

    try {
      const withdrawReference = `mijo-biz-wd-client-${crypto.randomUUID()}`;
      const res = await fetch(`${CONFIG.API_URL}/withdraw`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${getToken()}`
        },
        body: JSON.stringify({ amount, withdrawReference })
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        withdrawError.textContent = data.error || "Échec du retrait.";
        withdrawError.style.display = "block";
        withdrawConfirm.disabled = false;
        withdrawCancel.disabled = false;
        withdrawAmount.disabled = false;
        withdrawConfirm.textContent = "Confirmer";
        return;
      }

      withdrawActions.style.display = "none";
      withdrawSuccess.innerHTML = `
        ${escapeHtml(data.message)}
        <br>
        <a class="action-link" href="${CONFIG.MONCASH_WITHDRAW_PAGE}">Retirer vers MonCash maintenant</a>
      `;
      withdrawSuccess.style.display = "block";

      loadOverview();

    } catch (err) {
      withdrawError.textContent = "Connexion au serveur impossible.";
      withdrawError.style.display = "block";
      withdrawConfirm.disabled = false;
      withdrawCancel.disabled = false;
      withdrawAmount.disabled = false;
      withdrawConfirm.textContent = "Confirmer";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "index.html";
  });

  async function loadOverview() {
    const token = getToken();
    const user = getUser();

    if (!user || !user.userId || !token) {
      renderLoginGate();
      return;
    }

    try {
      const res = await fetch(`${CONFIG.API_URL}/overview`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        if (res.status === 401) {
          localStorage.removeItem("token");
          localStorage.removeItem("user");
          setTimeout(() => window.location.href = "index.html", 1200);
          return;
        }
        if (res.status === 404) {
          renderNotRegistered();
          return;
        }
        container.innerHTML = `<div class="state-msg"><div class="icon">⚠️</div><p>${escapeHtml(data.error || "Erreur de chargement.")}</p></div>`;
        return;
      }

      if (data.entreprise.Statut === "en_attente") {
        renderPending(data.entreprise.NomCommercial);
        return;
      }
      if (data.entreprise.Statut === "rejete") {
        renderRejected(data.entreprise.NomCommercial);
        return;
      }

      overviewData = data;
      renderDashboard(data);

    } catch (err) {
      container.innerHTML = `<div class="state-msg"><div class="icon">⚠️</div><p>Connexion au serveur impossible.</p></div>`;
    }
  }

  loadOverview();
</script>
</body>
</html>
